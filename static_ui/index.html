<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GGSel</title>
  <script>
  (function(){
    function save(d){ if(d) try{ sessionStorage.setItem("tg_init", d); }catch(e){} }
    try {
      var h = String(location.hash || "").replace(/^#/, "");
      save(new URLSearchParams(h).get("tgWebAppData"));
      var q = new URLSearchParams(location.search);
      save(q.get("tgWebAppData") || q.get("initData"));
    } catch (e) {}
  })();
  </script>
  <script src="/assets/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>

  <style>
:root {
  --bg: #f2f2f7;
  --card: rgba(255,255,255,.92);
  --btn: rgba(120,120,128,.12);
  --btn-press: rgba(120,120,128,.22);
  --line: rgba(60,60,67,.12);
  --text: #000000;
  --muted: rgba(60,60,67,.6);
  --accent: #34c759;
  --accent-hover: #2db350;
  --blue: #007aff;
  --danger: #ff3b30;
  --ok: #34c759;
  --ink: #1c1c1e;
  --logo-mark-color: #34c759;
  --logo-wordmark-color: #000000;
  --dock: rgba(255,255,255,.78);
  --hero: #1c1c1e;
  --shade: rgba(0,0,0,.4);
  --ease: cubic-bezier(.22,1,.36,1);
  --press: 0.97;
  --radius: 16px;
  --radius-lg: 22px;
  --hair: rgba(60,60,67,.18);
  --fill: #ffffff;
  --grouped: #ffffff;
}
html[data-theme="dark"] {
  --bg: #000000;
  --card: rgba(28,28,30,.92);
  --btn: rgba(120,120,128,.24);
  --btn-press: rgba(120,120,128,.36);
  --line: rgba(84,84,88,.65);
  --text: #ffffff;
  --muted: rgba(235,235,245,.6);
  --accent: #30d158;
  --accent-hover: #28c04e;
  --ink: #000000;
  --logo-wordmark-color: #ffffff;
  --dock: rgba(28,28,30,.78);
  --hero: #000000;
  --shade: rgba(0,0,0,.55);
  --hair: rgba(84,84,88,.65);
  --fill: #1c1c1e;
  --grouped: #1c1c1e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Geist, "Geist Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

}
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow-x: hidden; }
#app {

  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.stage { flex: 1; padding: 8px 16px 28px; }
.search-like {

.feat {

  flex: 0 0 156px;
  height: 176px;

  border-radius: 20px;

.feat.g { background: linear-gradient(160deg, #44cf5e 0%, #1fa34a 100%); }

.cards-h { perspective: 720px; }
.feat:nth-child(2) { animation-delay: .25s; }

.feat-lab { position: relative; z-index: 2; }
.scene {
  position: absolute;

  top: 6px;

}
.scene-svg { width: 100%; height: 100%; overflow: visible; }
.s-plus { transform-origin: 60px 48px; animation: plus-3d 2.4s ease-in-out infinite; }

.s-card { transform-origin: 60px 50px; animation: card-tilt 3s ease-in-out infinite; }
.s-chip { animation: ico-pulse 1.8s ease-in-out infinite; }
.s-person { animation: ico-nudge 2.2s ease-in-out infinite; }
.s-person.r { animation-delay: .35s; }
.s-link { animation: link-pulse 2.4s ease-in-out infinite; transform-origin: 60px 42px; }
.s-ear { transform-origin: 60px 48px; animation: well-3d 3s ease-in-out infinite; }
.s-wave { transform-origin: 60px 48px; animation: wave-ring 2.2s ease-out infinite; }
.s-wave.w2 { animation-delay: .55s; }
@keyframes plus-3d {
  0%,100% { transform: rotateX(12deg) rotateY(-16deg) scale(1); }
  50% { transform: rotateX(-8deg) rotateY(16deg) scale(1.12); }
}
@keyframes paper-lift {
  0%,100% { transform: translateY(0) rotate(-8deg) rotateY(-12deg); }
  50% { transform: translateY(-8px) rotate(5deg) rotateY(10deg); }
}
@keyframes coin-spin {
  0% { transform: rotateY(0) translateY(0); }
  50% { transform: rotateY(180deg) translateY(-6px); }
  100% { transform: rotateY(360deg) translateY(0); }
}
@keyframes card-tilt {
  0%,100% { transform: rotateX(8deg) rotateY(-18deg) translateY(0); }
  50% { transform: rotateX(-4deg) rotateY(16deg) translateY(-6px); }
}
@keyframes link-pulse {
  0%,100% { opacity: .45; stroke-width: 4; }
  50% { opacity: 1; stroke-width: 6; }
}
@keyframes wave-ring {
  0% { transform: scale(.7); opacity: .55; }
  100% { transform: scale(1.25); opacity: 0; }
}
.fig {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 12px;

}

}

}

}
.cta .fig { background: rgba(17,19,24,.28); }
.kbtn, .tile { min-height: 52px; }

}

}
.cta {
  appearance: none;
  width: 100%;
  border: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 14px;

  font: 600 15px/1 Geist, ui-sans-serif, system-ui, sans-serif;

.points { margin: 8px 0 14px; padding-left: 18px; color: var(--text); }

.panel { animation: enter .38s cubic-bezier(.32,.72,0,1) both; }
.panel.back { animation: enter-back .38s cubic-bezier(.32,.72,0,1) both; }
@keyframes enter {

}
.bubble, .hero, .item {

  border: 0.5px solid var(--hair);
  border-radius: var(--radius-lg);
  padding: 16px;
  line-height: 1.45;

}
.hero {

  padding: 8px 0 16px;
}
.sec { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 12px; }
.who { font-size: 22px; font-weight: 600; margin: 4px 0 10px; }
.bal-mini { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {

}
.bubble b { font-weight: 600; }
.muted, .hint { color: var(--muted); }

.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tile {

}
.tile:active { transform: scale(.98); background: var(--btn-press); }
.kb { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.kb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kb-row.one { grid-template-columns: 1fr; }
.kbtn, .submit {
  appearance: none;
  border: 0;
  background: var(--btn);
  border-radius: 14px;
  min-height: 50px;
  padding: 10px 14px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.kbtn:active, .tile:active, .submit:active, .chip:active { transform: scale(.975); }
.kbtn.danger { color: var(--danger); }
.submit, .kbtn.primary {
  background: var(--accent);
  color: #fff;
}
.submit:active, .kbtn.primary:active { background: var(--accent-hover); }
.pe { width: 22px; height: 22px; object-fit: contain; flex: 0 0 22px; }
.fig .pe { flex: none; object-fit: contain; }
.pe.lg { width: 26px; height: 26px; flex-basis: 26px; vertical-align: -5px; }
.line { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.item { border-radius: 16px; background: #fff; }
button.item {

}
.item .top { display: flex; justify-content: space-between; gap: 8px; }
.deal-row { display: flex; gap: 12px; align-items: center; }
.deal-thumb {

}

}

}

.deal-body { flex: 1; min-width: 0; }
input, textarea, select {
  width: 100%;
  margin-top: 8px;
  background: var(--btn);
  color: var(--text);

  border-radius: 16px;
  padding: 12px 14px;
  font-size: 16px;

}
#toast {

  background: #171717; color: #fff; padding: 10px 14px; border-radius: 16px;
  opacity: 0; pointer-events: none; transition: .22s ease; z-index: 20; max-width: 86%;

.err { color: var(--danger); }
.ok { color: var(--ok); }
.stage { flex: 1; padding: 8px 16px 120px; }
/* tabbar styles live in the redesign block below */

.pub-hero .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.pub-hero .stat {
  background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px 8px; text-align: center;
}
.pub-hero .stat .n { font-size: 18px; font-weight: 800; }
.pub-hero .stat .l { font-size: 11px; opacity: .7; margin-top: 2px; }
.pub-sec { margin: 4px 0 10px; font-size: 15px; font-weight: 800; }
.pub-deal, .pub-rev {
  background: var(--grouped); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
  border: 0.5px solid var(--hair);
}
.pub-deal .top, .pub-rev .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pub-deal .amt { font-weight: 800; }
.rate-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.rate-row .stars { color: #f5b301; letter-spacing: 1px; }
.me-hint { font-size: 12px; color: var(--muted); margin: -2px 0 8px; }

.admin-sheet {
  background: var(--grouped); border-radius: var(--radius-lg); padding: 16px;
  margin-bottom: 14px;
  border: 0.5px solid var(--hair);
}
.admin-sheet h2 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.admin-sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.admin-sheet input, .admin-sheet textarea {
  width: 100%; border: 0; background: var(--bg); color: var(--text); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 8px; font: 500 14px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", Geist, ui-sans-serif, system-ui, sans-serif;
  box-shadow: inset 0 0 0 0.5px var(--hair);
}
.admin-sheet textarea { min-height: 72px; resize: vertical; }
.admin-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.admin-actions .ghost, .admin-actions .go {
  appearance: none; border: 0; border-radius: 16px; min-height: 48px;
  padding: 0 14px; font-weight: 700; cursor: pointer; width: 100%;
  transition: transform .2s var(--ease), background .2s var(--ease);
}
.admin-actions .ghost { background: var(--btn); color: var(--text); }
.admin-actions .go { background: var(--accent); color: #fff; }
.admin-actions .ghost:active, .admin-actions .go:active { transform: scale(var(--press)); }
.admin-actions.one { grid-template-columns: 1fr; }
.admin-hero {
  background: linear-gradient(145deg, #122018 0%, #1a3a28 50%, #1db954 140%);
  color: #fff; border-radius: 24px; padding: 18px 16px; margin-bottom: 14px;
}
.admin-hero h1 { margin: 0; font-size: 22px; font-weight: 800; }
.admin-hero p { margin: 6px 0 0; opacity: .78; font-size: 13px; }
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.theme-card {
  appearance: none; border: 0; border-radius: 22px; min-height: 120px; cursor: pointer;
  padding: 16px; text-align: left; position: relative; overflow: hidden;
  box-shadow: inset 0 0 0 2px transparent; transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.theme-card:active { transform: scale(var(--press)); }
.theme-card.on { box-shadow: inset 0 0 0 2px var(--accent); }
.theme-card.light { background: #f4f6f8; color: #12151c; }
.theme-card.dark { background: #12161d; color: #f2f4f7; }
.theme-card .t-title { font-weight: 800; font-size: 16px; }
.theme-card .t-sub { margin-top: 4px; font-size: 12px; opacity: .65; }
.theme-card .swatch {
  position: absolute; right: 12px; bottom: 12px; width: 42px; height: 42px; border-radius: 14px;
}
.theme-card.light .swatch { background: linear-gradient(135deg,#fff,#dfe5ec); box-shadow: 0 6px 14px rgba(0,0,0,.08); }
.theme-card.dark .swatch { background: linear-gradient(135deg,#2a3140,#0e1116); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
#coach {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(8,10,14,.38);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  opacity: 0; pointer-events: none; transition: opacity .35s var(--ease);
}
#coach.on { opacity: 1; pointer-events: auto; }
.coach-card {
  position: absolute;
  width: min(300px, calc(100% - 28px));
  background: var(--card); color: var(--text);
  border-radius: 28px; padding: 20px 16px 14px;
  box-shadow: 0 28px 70px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.04);
  animation: coach-float 5.2s ease-in-out infinite;
  transition: top .55s var(--ease), left .55s var(--ease), right .55s var(--ease), bottom .55s var(--ease), transform .4s var(--ease);
}
@keyframes coach-float {
  0%,100% { transform: translate3d(0,0,0) rotate(-0.6deg); }
  50% { transform: translate3d(0,-10px,0) rotate(0.7deg); }
}
#coach.on .coach-card { }
.coach-card .step { font-size: 12px; font-weight: 800; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.coach-card h3 { margin: 8px 0 6px; font-size: 20px; letter-spacing: -.02em; }
.coach-card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.45; }
.coach-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.coach-actions button {
  appearance: none; border: 0; border-radius: 16px; min-height: 46px; font-weight: 700; cursor: pointer;
  transition: transform .2s var(--ease);
}
.coach-actions button:active { transform: scale(var(--press)); }
.coach-actions .skip { background: var(--btn); color: var(--text); }
.coach-actions .next { background: var(--accent); color: #fff; }
.coach-dots { display: flex; gap: 6px; justify-content: center; margin: 0 0 12px; }
.coach-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.coach-dots i.on { background: var(--accent); width: 18px; border-radius: 99px; }
.av, .avatar {
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.av span, .avatar span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-weight: 800; z-index: 0;
}
.av img, .avatar img, img.av-img {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  object-fit: cover !important;
  object-position: center center !important;
  border-radius: inherit;
  display: block;
  z-index: 1;
}
.rev .av {
  width: 52px; height: 52px; border-radius: 14px;
  display: block;
  background: #dff7e8;
}
img.av-sm {
  width: 14px !important; height: 14px !important;
  border-radius: 50% !important;
  object-fit: cover !important;
  flex: 0 0 14px;
  position: static !important;
  inset: auto !important;
}
.kbtn, .chip, .cta, .cta-light, .fab, .tab, .qcard {
  transition: transform .22s var(--ease), background .22s var(--ease), box-shadow .22s var(--ease);
}
.kbtn:active, .chip:active, .cta:active, .qcard:active { transform: scale(var(--press)); }
@media (max-width: 520px) {
  .logo-float, .logo-mark, .tab svg, .fig, .fig .pe, .feat, .cta, .chip-lang .gear, .fab, .live-dot {
    animation: none !important;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
.star-pick { display: flex; gap: 4px; margin: 0 0 8px; }
.star-pick button {
  appearance: none; border: 0; background: #fff; border-radius: 10px;
  width: 40px; height: 40px; cursor: pointer; color: #c5cad3; font-size: 18px;
  box-shadow: inset 0 0 0 1px rgba(18,21,28,.04);
}
.star-pick button.on { color: #f5b301; background: #fff8e6; }
.rev-admin {
  background: #fff; border-radius: 18px; padding: 12px; margin-top: 10px;
  display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start;
  box-shadow: 0 6px 14px rgba(18,21,28,.04);
}
.rev-admin img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: #e8edf2; }
.rev-admin .ops { display: flex; gap: 6px; margin-top: 8px; grid-column: 1 / -1; justify-content: flex-end; }
.rev-admin .ops button {
  appearance: none; border: 0; width: 36px; height: 36px; border-radius: 10px;
  background: #f4f6f8; cursor: pointer; font-weight: 700;
}
.rev-admin .ops .del { background: #ffe8e4; color: var(--danger); }
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 16;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0;
  background: var(--dock);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-radius: 28px;
  padding: 8px 10px 10px;
  box-shadow:
    0 0 0 0.5px var(--hair),
    0 12px 40px rgba(0,0,0,.12);
  width: min(400px, calc(100vw - 20px));
  overflow: visible;
}
.tab {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font: 600 10px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Geist, ui-sans-serif, system-ui, sans-serif;
  flex: 1 1 0; min-width: 0; border-radius: 14px;
  transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}
.tab svg { width: 22px; height: 22px; fill: currentColor; }
.tab.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tab.on span { color: var(--accent); }
.tab:active { transform: scale(.94); }
.fab {
  flex: 0 0 56px;
  width: 56px; height: 56px; margin: 0 6px 6px; border-radius: 50%;
  border: 0; appearance: none; cursor: pointer;
  background: linear-gradient(180deg, #36d35f, #28b84a);
  color: #fff;
  display: grid; place-items: center;
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 10px 24px rgba(52,199,89,.38);
  transform: translateY(-12px);
  transition: transform .2s var(--ease);
}
.fab:active { transform: translateY(-12px) scale(.94); }
.fab svg { width: 26px; height: 26px; fill: currentColor; }
.tab.admin-only { display: none !important; }
.tabbar.admin .tab.admin-only { display: flex !important; }
.tabbar.off { pointer-events: none; opacity: .45; }
.tabbar.hide { pointer-events: none; opacity: 0; visibility: hidden; }
  
/* === Full iPhone system look === */
:root {
  --ios-blue: #007aff;
  --ios-gray: #8e8e93;
  --ios-sep: rgba(60,60,67,.29);
  --ios-fill-secondary: rgba(120,120,128,.16);
  --large-title: 34px;
}
html[data-theme="dark"] {
  --ios-sep: rgba(84,84,88,.65);
  --ios-fill-secondary: rgba(120,120,128,.32);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif !important;
}
.stage { padding: 4px 16px 110px; }
.large-title {
  font-size: var(--large-title); font-weight: 700; letter-spacing: -.02em;
  margin: 4px 0 12px; line-height: 1.1;
}
.ios-section {
  font-size: 13px; font-weight: 400; color: var(--muted);
  text-transform: uppercase; letter-spacing: -.01em;
  margin: 18px 8px 8px; padding: 0;
}
.ios-group {
  background: var(--grouped); border-radius: 12px; overflow: hidden;
  margin-bottom: 8px;
  box-shadow: 0 0 0 0.5px var(--hair);
}
.ios-row {
  appearance: none; border: 0; background: transparent; color: var(--text);
  width: 100%; display: flex; align-items: center; gap: 12px;
  min-height: 44px; padding: 10px 16px; text-align: left; cursor: pointer;
  font: 400 17px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  position: relative;
}
.ios-row + .ios-row::before {
  content: ""; position: absolute; left: 54px; right: 0; top: 0; height: 0.5px;
  background: var(--ios-sep);
}
.ios-row .flag { font-size: 22px; width: 28px; text-align: center; flex: 0 0 28px; }
.ios-row .meta { flex: 1; min-width: 0; }
.ios-row .meta b { display: block; font-weight: 500; font-size: 17px; }
.ios-row .meta small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
.ios-row .amt { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 17px; }
.ios-row .chev { color: var(--ios-gray); font-size: 18px; font-weight: 300; }
.ios-row.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ios-row:active { background: var(--ios-fill-secondary); }
.ios-search {
  width: 100%; border: 0; background: var(--ios-fill-secondary); color: var(--text);
  border-radius: 10px; padding: 10px 12px; margin: 0 0 12px;
  font: 400 17px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
.wallet-card {
  background: linear-gradient(160deg, #1c1c1e 0%, #2c2c2e 55%, #3a3a3c 100%);
  color: #fff; border-radius: 20px; padding: 20px 18px 16px; margin: 4px 0 16px;
  box-shadow: 0 12px 32px rgba(0,0,0,.18);
  position: relative; overflow: hidden;
}
html[data-theme="dark"] .wallet-card {
  background: linear-gradient(160deg, #2c2c2e 0%, #1c1c1e 100%);
  box-shadow: 0 0 0 0.5px var(--hair), 0 12px 32px rgba(0,0,0,.4);
}
.wallet-card::after {
  content: ""; position: absolute; right: -20%; top: -40%; width: 60%; height: 120%;
  background: radial-gradient(circle, rgba(52,199,89,.22), transparent 70%);
  pointer-events: none;
}
.wallet-card .lab { font-size: 13px; font-weight: 500; opacity: .65; position: relative; z-index: 1; }
.wallet-card .sum {
  font-size: 40px; font-weight: 700; letter-spacing: -.03em; margin: 6px 0 14px;
  font-variant-numeric: tabular-nums; position: relative; z-index: 1;
}
.wallet-card .sum small { font-size: 22px; font-weight: 600; opacity: .75; margin-left: 4px; }
.wallet-card .cur-row { position: relative; z-index: 1; gap: 8px; }
.wallet-card .cur {
  appearance: none; border: 0; background: rgba(255,255,255,.12); color: #fff;
  border-radius: 999px; padding: 7px 12px; font: 600 12px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  cursor: pointer; white-space: nowrap;
}
.wallet-card .cur.on { background: #fff; color: #000; }
.wallet-card .cur-all {
  background: rgba(52,199,89,.9) !important; color: #fff !important;
}
.splash {
  background: var(--grouped) !important;
  border-radius: 20px !important;
  border: 0.5px solid var(--hair);
  box-shadow: none !important;
  color: var(--text) !important;
}
.splash::before, .splash::after { display: none !important; }
.splash .badge {
  background: color-mix(in srgb, var(--accent) 16%, transparent) !important;
  color: var(--accent) !important;
}
.splash h1 { color: var(--text) !important; font-size: 28px !important; font-weight: 700 !important; letter-spacing: -.02em; margin-left: 0 !important; }
.splash p { color: var(--muted) !important; margin-left: 0 !important; }
.splash .cta-light {
  background: var(--accent) !important; color: #fff !important;
  border-radius: 14px !important; font-weight: 600 !important;
}
.qcard {
  background: var(--grouped) !important;
  border: 0.5px solid var(--hair) !important;
  border-radius: 16px !important;
  box-shadow: none !important;
}
.qcard .qi {
  background: color-mix(in srgb, var(--accent) 14%, transparent) !important;
  color: var(--accent) !important; border-radius: 10px !important;
}
.bal-card { display: none; }
.tabbar {
  border-radius: 999px !important;
  padding: 6px 8px 8px !important;
}
.tab.on { background: transparent !important; color: var(--ios-blue) !important; }
.tab.on span { color: var(--ios-blue) !important; }
.fab {
  background: var(--accent) !important;
  box-shadow: 0 8px 20px rgba(52,199,89,.35) !important;
}
.rev, .mcard, .admin-sheet, .pub-deal, .pub-rev {
  border-radius: 12px !important;
}
.kbtn {
  border-radius: 12px !important;
  font-weight: 600 !important;
}
.lang-list, .cur-list { display: flex; flex-direction: column; gap: 0; }
.lang-list { background: var(--grouped); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 0.5px var(--hair); }
.lang-row {
  border-radius: 0 !important; box-shadow: none !important;
  border: 0 !important; background: transparent !important;
  min-height: 52px !important; padding: 10px 16px !important;
}
.lang-row + .lang-row { box-shadow: inset 0 0.5px 0 var(--ios-sep) !important; }
.chip {
  border-radius: 999px !important;
  font-weight: 600 !important;
}
.topbar {
  padding: 6px 16px 8px !important;
}

window.__nftImgFail=function(img){

  if(i<chain.length){

function destroyNftAnims(){
  (window.__nftAnims||[]).forEach(a=>{ try{ a.destroy(); }catch(e){} });
  window.__nftAnims=[];
  window.__nftAnimCount=0;
}
function mountNftAnims(root){
  const scope=root||document;
  if(!window.lottie||!window.lottie.loadAnimation) return;
  const lowPower=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent||"");
  const maxLive=lowPower?3:6;
  const nodes=[...scope.querySelectorAll(".nft-lottie:not([data-mounted])")];
  nodes.forEach(el=>{
    const path=el.getAttribute("data-lottie")||"";
    const alt=el.getAttribute("data-lottie-alt")||"";
    if(!path) return;
    el.dataset.mounted="1";
    const parent=el.parentElement;
    const still=parent&&parent.querySelector("img");
    let triedAlt=false;
    let animRef=null;
    const start=(src)=>{
      if((window.__nftAnimCount||0)>=maxLive) return;
      try{
        const anim=window.lottie.loadAnimation({
          container:el,
          renderer: lowPower ? "canvas" : "svg",
          loop:true,
          autoplay:true,
          path:src,
          rendererSettings:{
            preserveAspectRatio:"xMidYMid meet",
            progressiveLoad:true,
            clearCanvas:true,
            hideOnTransparent:true
          }
        });
        window.__nftAnims.push(anim);
        window.__nftAnimCount=(window.__nftAnimCount||0)+1;
        animRef=anim;
        anim.addEventListener("DOMLoaded",()=>{
          el.classList.add("on");
          if(still) still.classList.add("is-fail");
        });
        anim.addEventListener("data_failed",()=>{
          try{ anim.destroy(); }catch(e){}
          window.__nftAnimCount=Math.max(0,(window.__nftAnimCount||1)-1);
          if(!triedAlt && alt && alt!==src){
            triedAlt=true;
            el.innerHTML="";
            start(alt);
          }
        });
      }catch(e){}
    };
    if("IntersectionObserver" in window){
      const io=new IntersectionObserver((entries)=>{
        entries.forEach(en=>{
          if(en.isIntersecting){
            if(!animRef) start(path);
            else try{ animRef.play(); }catch(e){}
          } else if(animRef){
            try{ animRef.pause(); }catch(e){}
          }
        });
      },{rootMargin:"40px", threshold:0.12});
      io.observe(el);
    }else{
      start(path);
    }
  });
}

function fillRandomReview(){
  const pick=REVIEW_POOL[Math.floor(Math.random()*REVIEW_POOL.length)];
  const other=REVIEW_POOL[(Math.floor(Math.random()*REVIEW_POOL.length)+3)%REVIEW_POOL.length][0];
  const roleEl=document.getElementById("rv-role");
  const role=(roleEl&&roleEl.value)||"buyer";
  const author=document.getElementById("rv-user");
  const seller=document.getElementById("rv-seller");
  const buyer=document.getElementById("rv-buyer");
  const body=document.getElementById("rv-body");
  const date=document.getElementById("rv-date");
  const amount=document.getElementById("rv-amount");
  const rating=document.getElementById("rv-rating");
  const me=state.user&&state.user.username?("@"+state.user.username):"me";
  if(role==="buyer"){
    if(author) author.value=me;
    if(buyer) buyer.value=me;
    if(seller) seller.value="@"+other;
  }else{
    if(author) author.value=me;
    if(seller) seller.value=me;
    if(buyer) buyer.value="@"+other;
  }
  if(body) body.value=pick[1];
  if(date) date.value=pick[2];
  if(amount) amount.value=String(50+Math.floor(Math.random()*450));
  if(rating) rating.value="5";

}

function dealFingerprint(d){
  if(!d) return "";
  return [d.code,d.status,d.role||"",d.buyer_id||"",d.seller_id||"",d.amount].join("|");
}
function dealsFingerprint(list){
  return (list||[]).map(d=>[d.code,d.status,d.role||""].join(":")).join(",");
}
let dealWatch=null;
function homeFingerprint(market,feed,reviews,cur,val,seed){
  const m=(market||[]).map(x=>[x.code,x.status,x.amount,x.owner_id||x.seller_id||"",x.demo?1:0].join(":")).join(",");
  const f=(feed||[]).map(x=>x.id).join(",");
  const r=(reviews||[]).map(x=>x.id).join(",");
  return [m,f,r,cur,val,seed||0].join("|");
}
function watchDeal(){
  clearInterval(dealWatch);
  dealWatch=null;
  const s=state.screen;
  if(s==="deal-view"&&state.dealCode) dealWatch=setInterval(refreshOpenDeal,2000);
  else if(s==="deals") dealWatch=setInterval(refreshDealsList,4000);
  else if(s==="home") dealWatch=setInterval(refreshHomeLive,12000);
  else if(s==="market") dealWatch=setInterval(refreshMarketLive,10000);
  else if(s==="market-view") dealWatch=setInterval(refreshMarketView,8000);
}
async function refreshHomeLive(){
  if(state.screen!=="home") return;
  try{
    const cur=state.balCur||"rub";
    const b=(state.user&&state.user.balances)||{};
    const val=b[cur];
    const [feedRes,reviewsRes]=await Promise.all([
      api("/api/feed").catch(()=>null),
      api("/api/reviews").catch(()=>null),
    ]);
    let feed=state.feed||[];
    let reviews=state.reviews||[];
    if(feedRes) feed=feedRes.items||feed;
    if(reviewsRes) reviews=reviewsRes.reviews||reviews;
    const fp=homeFingerprint([],feed,reviews,cur,val,0);
    if(fp===state.homeSig) return;
    state.feed=feed; state.reviews=reviews; state.homeSig=fp;
    await draw({quiet:true});
  }catch(e){}
}
async function refreshMarketLive(){
  if(state.screen!=="market") return;
  try{
    const f=state.marketFilter||{};
    const qs=new URLSearchParams();
    if(f.q) qs.set("q", f.q);
    if(f.collection) qs.set("collection", f.collection);
    if(f.sort) qs.set("sort", f.sort);
    const r=await api("/api/market?"+qs.toString());
    const next=r.items||[];
    const seed=r.seed||0;
    const fp=[seed,(next||[]).map(x=>x.code).join(","),f.q||"",f.collection||"",f.sort||""].join("|");
    if(fp===state.marketSig && next.length) return;
    if(next.length || !(state.market||[]).length) state.market=next;
    state.marketSeed=seed||state.marketSeed;
    state.marketRotateIn=r.rotate_in||state.marketRotateIn||60;
    if(r.collections) state.marketCollections=r.collections;
    state.marketSig=fp;
    await draw({quiet:true});
  }catch(e){}
}
async function refreshMarketView(){
  if(state.screen!=="market-view"||!state.marketCode) return;
  try{
    const r=await api("/api/market");
    const list=r.items||[];
    if(list.length){
      state.market=list;
      state.marketSeed=r.seed||state.marketSeed;
      state.marketRotateIn=r.rotate_in||state.marketRotateIn;
    }
    const still=list.some(x=>x.code===state.marketCode)||(state.market||[]).some(x=>x.code===state.marketCode);
    if(!still) await draw({quiet:true});
  }catch(e){}
}
async function refreshOpenDeal(){
  if(state.screen!=="deal-view"||!state.dealCode) return;
  try{
    const d=(await api("/api/deals/"+state.dealCode)).deal;
    const fp=dealFingerprint(d);
    if(fp===state.dealSig) return;
    state.deal=d;
    state.dealSig=fp;
    await draw({quiet:true});
  }catch(e){}
}
async function refreshDealsList(){
  if(state.screen!=="deals") return;
  try{
    const {deals}=await api("/api/deals");
    const fp=dealsFingerprint(deals);
    if(fp===state.dealsSig) return;
    state.deals=deals||[];
    state.dealsSig=fp;
    await draw({quiet:true});
  }catch(e){}
}

async function loadMe(opts={}){

    clearTimeout(window.__mqT);
    window.__mqT=setTimeout(()=>{
      state.marketFilter=Object.assign({},state.marketFilter||{},{q:String(ev.target.value||"").trim()});
      if(state.screen==="market") draw({quiet:true});
    },280);
  }
  if(ev.target&&ev.target.id==="f-desc"){
    const box=document.getElementById("nft-prev");
    if(!box) return;
    const n=nftInfo(ev.target.value);
    box.innerHTML=n?`<div class="nft-prev"><div class="shot">${nftAnimHtml(n)}</div><div class="nft-prev-meta"><b>${esc(n.name)}${n.num?" #"+esc(n.num):""}</b><div class="hint">${esc(n.url)}</div></div></div>`:"";
    mountNftAnims(box);
  }
  if(ev.target&&ev.target.id==="rv-nft"){
    const box=document.getElementById("rv-nft-prev");
    if(!box) return;
    const n=nftInfo(ev.target.value);
    box.innerHTML=n?`<div class="nft-prev"><div class="shot">${nftAnimHtml(n)}</div><div class="nft-prev-meta"><b>${esc(n.name)}${n.num?" #"+esc(n.num):""}</b></div></div>`:"";
    mountNftAnims(box);
  }
  if(ev.target&&ev.target.id==="fd-nft"){
    const box=document.getElementById("fd-nft-prev");
    if(!box) return;
    const n=nftInfo(ev.target.value);
    box.innerHTML=n?`<div class="nft-prev"><div class="shot">${nftAnimHtml(n)}</div><div class="nft-prev-meta"><b>${esc(n.name)}${n.num?" #"+esc(n.num):""}</b></div></div>`:"";
    mountNftAnims(box);
  }
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(state.screen==="deal-view") refreshOpenDeal();
  else if(state.screen==="deals") refreshDealsList();
  else if(state.screen==="home") refreshHomeLive();
  else if(state.screen==="market") refreshMarketLive();
  else if(state.screen==="market-view") refreshMarketView();
});
if(tg&&tg.BackButton){tg.BackButton.onClick(()=>back());}
(async function init(){
  applyTheme(rememberedTheme()||"light");
  const intro=playIntro();
  let lastErr=null;
  for(let i=0;i<8;i++){
    try{
      await loadMe();
      await intro;
      if(needLangPicker()){
        state.screen="lang";
        state.stack=["lang"];
      } else if(needThemePicker()){
        state.screen="theme";
        state.stack=["theme"];
      } else {
        await enterApp();
      }
      syncLangChip();
      syncBack();
      await draw();
      if(!needLangPicker() && !needThemePicker() && needCoach()) showCoach(0);
      return;
    }catch(e){
      lastErr=e;
      await new Promise(r=>setTimeout(r,250));
    }
  }
  try{await intro;}catch(e){}
  document.getElementById("screen").innerHTML=bubble(`<b>Не удалось открыть сессию</b><p class="hint">Закрой окно и нажми «Выбрать язык» в боте.</p>`)+kb([[act("Повторить","go:home","btn_back","🔄")]]);
})();
  </script>
