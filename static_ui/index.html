    function save(d){ if(d) try{ sessionStorage.setItem("tg_init", d); }catch(e){} }
    try {
      var h = String(location.hash || "").replace(/^#/, "");
      save(new URLSearchParams(h).get("tgWebAppData"));
      var q = new URLSearchParams(location.search);
      save(q.get("tgWebAppData") || q.get("initData"));

:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;

  color: var(--text);
  font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow-x: hidden; }
.aurora {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(72px);
  opacity: 0.34;
  will-change: transform;
}
.orb.a {
  width: 280px; height: 280px;
  background: #3ee0b0;
  top: -90px; left: -70px;
  animation: drift 26s ease-in-out infinite;
}
.orb.b {
  width: 240px; height: 240px;
  background: #4f7dff;
  right: -80px; top: 28%;
  opacity: 0.28;
  animation: drift 32s ease-in-out infinite reverse;
}
.orb.c {
  width: 200px; height: 200px;
  background: #8b7cf5;
  left: 22%; bottom: 8%;
  opacity: 0.22;
  animation: drift 38s ease-in-out infinite;
}
@keyframes drift {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  40% { transform: translate3d(28px, 18px, 0) scale(1.06); }
  70% { transform: translate3d(-18px, 26px, 0) scale(0.96); }
}
#app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.stage { flex: 1; padding: 16px 16px 28px; }
.panel { animation: enter .38s cubic-bezier(.22,1,.36,1) both; }
.panel.back { animation: enter-back .38s cubic-bezier(.22,1,.36,1) both; }
@keyframes enter {
  from { opacity: 0; transform: translate3d(16px, 8px, 0); }
  to { opacity: 1; transform: none; }
}
@keyframes enter-back {
  from { opacity: 0; transform: translate3d(-16px, 8px, 0); }
  to { opacity: 1; transform: none; }
}
.bubble, .hero, .item, .tile, .kbtn, input, textarea, select {
  background: var(--card);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.bubble, .hero {
  border-radius: 22px;
  padding: 16px 16px 14px;
  line-height: 1.45;
  font-size: 15.5px;
}
.hero {
  background: linear-gradient(180deg, rgba(126,224,197,0.10), rgba(22,32,48,0.55));
  margin-bottom: 14px;
}
.hello { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.who { font-size: 26px; font-weight: 780; margin: 6px 0 10px; }
.bal-mini { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13.5px; }
.bubble b { font-weight: 750; }
.quote { margin: 10px 0 0; color: var(--muted); }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tile {
  min-height: 92px;
  border-radius: 20px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  color: var(--text);
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  transition: transform .2s ease, background .2s ease;
}
.tile:active { transform: scale(.97); background: var(--btn-press); }
.kb { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.kb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kb-row.one { grid-template-columns: 1fr; }
.kbtn, .submit {
  appearance: none;
  border-radius: 16px;
  min-height: 48px;
  padding: 10px 12px;
  font-size: 14.5px;
  font-weight: 650;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text);
  cursor: pointer;
  transition: transform .18s ease, background .18s ease;
}
.kbtn:active, .tile:active, .submit:active { transform: scale(.975); }
.kbtn.danger { color: var(--danger); }
.submit {
  width: 100%;
  margin-top: 10px;
  background: linear-gradient(180deg, rgba(126,224,197,.95), rgba(62,196,164,.92));
  color: #073126;
  border: 0;
}
.pe { width: 22px; height: 22px; object-fit: contain; flex: 0 0 22px; }
.pe.lg { width: 26px; height: 26px; flex-basis: 26px; vertical-align: -5px; }
.line { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.item { border-radius: 18px; padding: 12px 14px; }
.item .top { display: flex; justify-content: space-between; gap: 8px; }
input, textarea, select {
  width: 100%;
  margin-top: 8px;
  color: var(--text);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 16px;
}
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
  background: rgba(24, 34, 50, .92); color: #fff; padding: 10px 14px; border-radius: 14px;
  opacity: 0; pointer-events: none; transition: .22s ease; z-index: 20; max-width: 86%;
  border: 1px solid var(--line);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.err { color: var(--danger); }
.ok { color: var(--ok); }

const PAYS=[["ton","pay_ton","btn_pay_ton","💎"],["card","pay_card","btn_pay_card","💳"],["stars","pay_stars","btn_pay_stars","⭐"],["usdt","pay_usdt","btn_pay_usdt","🪙"],["usd","pay_usd","btn_pay_usd","💸"],["eur","pay_eur","btn_pay_eur","💰"],["byn","pay_byn","btn_pay_byn","🇧🇾"],["kzt","pay_kzt","btn_pay_kzt","🇰🇿"],["uah","pay_uah","btn_pay_uah","🇺🇦"]];
const TYPES=[["gift","gift","btn_deal_gift","🎁"],["channel","channel","btn_deal_channel","📣"],["stars","stars","btn_deal_stars","⭐"],["nft","nft","btn_deal_nft","⛓️"]];
const WDRAW=[["ton","w_ton","btn_pay_ton","💎"],["card","w_card","btn_pay_card","💳"],["byn","w_byn","btn_pay_byn","🇧🇾"],["kzt","w_kzt","btn_pay_kzt","🇰🇿"],["uah","w_uah","btn_pay_uah","🇺🇦"],["stars","w_stars","btn_pay_stars","⭐"],["usdt","w_usdt","btn_pay_usdt","🪙"],["usd","w_usd","btn_pay_usd","💸"],["eur","w_eur","btn_pay_eur","💰"]];
const GROUPS=[["Crypto",[["ton","💎","balance_ton"],["usdt","🪙","balance_usdt"],["stars","⭐","balance_stars"]]],["Fiat",[["rub","💵","balance_rub"],["byn","🇧🇾","balance_byn"],["kzt","🇰🇿","balance_kzt"],["uah","🇺🇦","balance_uah"],["usd","💸","balance_usd"],["eur","💰","balance_eur"]]]];
const state={user:null,screen:"home",dir:"fwd",stack:["home"],draft:{role:"",deal_type:"",pay_method:"",amount:"",description:""},admin:{currency:"",uid:"",amount:""},wmethod:"",deals:[],link:""};
function t(key){const lang=state.user&&state.user.language==="en"?"en":"ru";return (I18N[lang][key]||I18N.ru[key]||key);}
function pe(key, fb){return `<img class="pe" src="/e/${key}.webp" alt="${fb||""}" onerror="this.outerHTML=this.alt||''">`;}
function pel(key, fb){return `<img class="pe lg" src="/e/${key}.webp" alt="${fb||""}" onerror="this.outerHTML=this.alt||''">`;}
function haptic(){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred("light");}catch(e){}}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2400);}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
function readInitData(){
  const fromTg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData;
  if(fromTg){try{sessionStorage.setItem("tg_init",fromTg);}catch(e){} return fromTg;}
  const stored=sessionStorage.getItem("tg_init")||"";
  if(stored) return stored;
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));
    const v=h.get("tgWebAppData");
    if(v){sessionStorage.setItem("tg_init",v);return v;}
  }catch(e){}
  try{
    const q=new URLSearchParams(location.search);
    const v=q.get("tgWebAppData")||q.get("initData");
    if(v){sessionStorage.setItem("tg_init",v);return v;}
  }catch(e){}
  return "";
}
async function waitInitData(){
  for(let i=0;i<50;i++){
    const d=readInitData();
    if(d) return d;
    await new Promise(r=>setTimeout(r,80));
  }
  return readInitData();
}
async function api(path,opts={}){
  const initData=await waitInitData();
  const res=await fetch(path,{...opts,headers:{"Content-Type":"application/json","Authorization":"tma "+initData,"X-Telegram-Init-Data":initData,...(opts.headers||{})}});
  const data=await res.json().catch(()=>({ok:false,error:"bad_json"}));
  if(!data.ok){
    const map={auth:"Открой Mini App кнопкой в боте",banned:"Вы заблокированы",need_deals:"Нужно минимум 3 завершённые сделки",need_ton:"Сначала добавь TON в реквизитах",need_card:"Сначала добавь карту",need_username:"Сначала добавь юзернейм",empty:"Недостаточно средств",nft_link:"Нужна ссылка https://t.me/nft/...",forbidden:"Нет доступа"};
    throw new Error(map[data.error]||data.error||"Ошибка");
  }
  return data;
}
function kb(rows){
  return `<div class="kb">${rows.map(row=>`<div class="kb-row ${row.length===1?"one":""}">${row.join("")}</div>`).join("")}</div>`;
}
function btn(label, go, icon, fb, extra=""){
  const ico=icon?pe(icon,fb):"";
  return `<button class="kbtn" data-go="${esc(go)}" ${extra}>${ico}<span>${label}</span></button>`;
}
function act(label, action, icon, fb, cls=""){
  const ico=icon?pe(icon,fb):"";
  return `<button class="kbtn ${cls}" data-act="${esc(action)}">${ico}<span>${label}</span></button>`;
}
function backBtn(){return btn(t("back"),"home","btn_back","🔙");}
function cancelBtn(){return act(t("cancel"),"go:home","btn_cancel","❌","danger");}
function bubble(html){return `<div class="bubble">${html}</div>`;}
function syncBack(){
  if(!tg||!tg.BackButton) return;
  if(state.screen==="home") tg.BackButton.hide();
  else tg.BackButton.show();
}
function go(name, dir="fwd"){
  haptic();
  state.dir=dir;
  if(name==="home") state.stack=["home"];
  else if(dir==="fwd") state.stack.push(name);
  state.screen=name;
  syncBack();
  draw();
}
function back(){
  if(state.stack.length>1) state.stack.pop();
  state.dir="back";
  state.screen=state.stack[state.stack.length-1]||"home";
  syncBack();
  draw();
}
function screenHome(){
  const u=state.user;
  const name=u.full_name||(u.username?("@"+u.username):"GGSel");
  const b=u.balances||{};
  const tiles=[
    `<button class="tile" data-go="create-role">${pe("btn_create","➕")}<span>${t("create")}</span></button>`,
    `<button class="tile" data-go="req">${pe("btn_requisites","💼")}<span>${t("req")}</span></button>`,
    `<button class="tile" data-go="bal">${pe("btn_balance","🧳")}<span>${t("bal")}</span></button>`,
    `<button class="tile" data-go="deals">${pe("btn_deals","📑")}<span>${t("deals")}</span></button>`,
    `<button class="tile" data-go="refs">${pe("btn_refs","🌐")}<span>${t("refs")}</span></button>`,
    `<button class="tile" data-go="lang">${pe("btn_lang","🌐")}<span>${t("lang")}</span></button>`,
    `<button class="tile" data-act="support">${pe("btn_support","🎧")}<span>${t("support")}</span></button>`
  ];
  if(u.is_admin) tiles.push(`<button class="tile" data-go="admin">${pe("construction","🛠")}<span>${u.is_super_admin?t("owner"):t("admin")}</span></button>`);
  return `<div class="hero">
      <div class="hello">GGSel</div>
      <div class="who">${esc(name)}</div>
      <div class="bal-mini">${pel("balance_ton","💎")} ${esc(b.ton??0)} · ${pel("balance_stars","⭐")} ${esc(b.stars??0)}</div>
    </div>
    <div class="tiles">${tiles.join("")}</div>`;
}
function screenReq(){
  const u=state.user;
  const bits=[];
  if(u.ton_wallet) bits.push(`<div class="line">${pe("balance_ton","💎")} TON: <code>${esc(u.ton_wallet)}</code></div>`);
  if(u.card_number){const d=String(u.card_number).replace(/\D/g,"");bits.push(`<div class="line">${pe("balance_card","💳")} ${u.language==="en"?"Card":"Карта"}: <code>${esc(d.slice(0,4)+" **** **** "+d.slice(-4))}</code></div>`);}
  if(u.payout_username) bits.push(`<div class="line">${pe("deal_person","👤")} @${esc(String(u.payout_username).replace(/^@/,""))}</div>`);
  return bubble(`${pe("requisites_doc","🪪")} <b>${t("req_title")}</b><p class="hint">${t("req_hint")}</p>${bits.join("")}`)+
    kb([[btn(t("ton"),"req-ton","btn_ton","💎")],[btn(t("card"),"req-card","btn_card","💳")],[btn(t("uname"),"req-user","btn_role_buyer","👤")],[backBtn()]]);
}

  return bubble(`${pe(icon,fb)} <b>${title}</b><p class="hint">${hint}</p><input id="${id}" value="${esc(value)}" />`)+
    kb([[act(t("save"),save,icon,fb)],[backBtn()]]);

    [btn(t("seller"),"create-type-seller","btn_role_seller","🏷")],
    [btn(t("buyer"),"create-type-buyer","btn_role_buyer","🛒")],

    ...TYPES.map(([id,key,icon,fb])=>[btn(t(key),"create-pay-"+id,icon,fb)]),
    [backBtn()]

  const rows=[];
  for(let i=0;i<PAYS.length;i+=2){
    const a=PAYS[i], b=PAYS[i+1];

  }
  rows.push([backBtn()]);
  return bubble(t("deal_pay"))+kb(rows);
}
function screenCreateAmt(){
  return bubble(`<b>${t("create")}</b><p class="hint">${t("amount")}</p><input id="f-amount" inputmode="decimal" value="${esc(state.draft.amount)}" placeholder="100" />`)+
    kb([[act(t("save"),"deal-amount","deal_money","💰")],[cancelBtn()]]);
}
function screenCreateDesc(){
  const nft=state.draft.deal_type==="gift"||state.draft.deal_type==="nft";
  return bubble(`${nft?pe("btn_deal_gift","🎁"):pe("deal_memo","📝")} <b>${nft?t("desc_nft"):t("desc")}</b><p class="hint">${nft?"https://t.me/nft/Name-123":""}</p><textarea id="f-desc" rows="3">${esc(state.draft.description)}</textarea>`)+
    kb([[act(t("make"),"deal-make","btn_create","➕")],[cancelBtn()]]);
}
function screenCreateDone(){
  return bubble(`${pe("deal_check","✅")} <b>${t("created")}</b><p class="hint">${esc(state.link)}</p><input readonly value="${esc(state.link)}" />`)+
    kb([[act(t("copy"),"copy-link","deal_link","🔗")],[backBtn()]]);
}
function screenBal(){
  const b=state.user.balances||{};
  const groups=GROUPS.map(([name,keys])=>`<b>${name}</b>`+keys.map(([k,fb,icon])=>`<div class="line">${pe(icon,fb)} ${k.toUpperCase()}: <b>${b[k]??0}</b></div>`).join("")).join("<br>");
  const rows=[];
  for(let i=0;i<WDRAW.length;i+=2){
    const a=WDRAW[i], c=WDRAW[i+1];
    const row=[btn(t(a[1]),"wd-"+a[0],a[2],a[3])];
    if(c) row.push(btn(t(c[1]),"wd-"+c[0],c[2],c[3]));
    rows.push(row);
  }
  rows.push([backBtn()]);
  return bubble(`${pe("balance_card","💳")} <b>${t("bal")}</b><br><br>${groups}<p class="hint">${pe("deal_excl","❗️")} ${t("withdraw_hint")}</p>`)+kb(rows);
}
function screenWd(){
  return bubble(`${pe("deal_money","💰")} <b>${t("withdraw")}</b><p class="hint">${t("amount")}</p><input id="w-amount" inputmode="decimal" placeholder="100" />`)+
    kb([[act(t("withdraw"),"do-withdraw","deal_money","💰")],[backBtn()]]);
}
async function screenDeals(){
  const {deals}=await api("/api/deals");
  state.deals=deals;
  if(!deals.length) return bubble(`${pe("btn_deals","📑")} <b>${t("deals")}</b><p class="hint">${t("emptyDeals")}</p>`)+kb([[backBtn()]]);
  const cards=deals.map(d=>{
    let actions="";
    if(d.status==="open"&&d.role) actions+=act(t("cancel"),"deal-cancel-"+d.code,"btn_cancel","❌","danger");
    if(d.status==="active"&&d.role==="buyer") actions+=act("Оплатить с баланса","deal-paybal-"+d.code,"deal_money","💰");
    if(d.status==="paid"&&d.role==="seller") actions+=act("Товар передан гаранту","deal-sent-"+d.code,"btn_deal_sent","📦");
    if(d.status==="goods_sent"&&d.role==="buyer") actions+=act("Подтвердить получение","deal-recv-"+d.code,"btn_deal_recv","✅");
    return `<div class="item"><div class="top"><b>#${esc(d.code)}</b><span class="muted">${esc(d.status)}</span></div><div class="hint">${esc(d.deal_type)} · ${esc(d.pay_method)} · ${d.amount} · ${esc(d.role)}</div><div class="hint">${esc(d.description)}</div><div class="kb" style="margin-top:8px">${actions}</div></div>`;
  }).join("");
  return bubble(`${pe("btn_deals","📑")} <b>${t("deals")}</b>`)+`<div class="list">${cards}</div>`+kb([[backBtn()]]);
}
function screenRefs(){
  const u=state.user;
  const link=u.bot_username?`https://t.me/${u.bot_username}?start=${u.id}`:"";
  return bubble(`${pe("btn_refs","🌐")} <b>${t("refs")}</b><p>${t("refsText")}</p><p>${t("invited")}: <b>${u.referral_count}</b></p><p class="hint">${t("refs_link")}</p><input readonly value="${esc(link)}" />`)+
    kb([[act(t("copy"),"copy:"+link,"deal_link","🔗")],[backBtn()]]);
}
function screenLang(){
  return bubble(`🌐 <b>${t("lang_title")}</b>`)+kb([[btn(t("ru"),"set-lang-ru","btn_lang_ru","🇷🇺")],[btn(t("en"),"set-lang-en","btn_lang_en","🇬🇧")],[backBtn()]]);
}
function screenAdmin(){
  const u=state.user;
  if(!u.is_admin) return bubble("Нет доступа")+kb([[backBtn()]]);
  const rows=[
    [btn(t("credit"),"admin-credit","deal_money","💰")],
    [btn(t("mybal"),"admin-bal","deal_person","👤")],
    [btn(t("transfer"),"admin-xfer","btn_deal_stars","⭐")]
  ];
  if(u.is_super_admin){
    rows.push([btn(t("grant"),"admin-grant","btn_create","➕")]);
    rows.push([btn(t("ban"),"admin-ban","btn_cancel","🚫"), btn(t("unban"),"admin-unban","btn_deal_recv","✅")]);
  }
  rows.push([backBtn()]);
  return bubble(`${pe("construction","🛠")} <b>${u.is_super_admin?t("owner"):t("worker")}</b>`)+kb(rows);
}
function currencyScreen(prefix){
  const keys=Object.keys(state.user.balances||{ton:0,rub:0,stars:0,usdt:0,usd:0,eur:0,byn:0,kzt:0,uah:0});
  const meta={ton:["btn_pay_ton","💎"],rub:["btn_pay_rub","💵"],byn:["btn_pay_byn","🇧🇾"],kzt:["btn_pay_kzt","🇰🇿"],uah:["btn_pay_uah","🇺🇦"],stars:["btn_pay_stars","⭐"],usdt:["btn_pay_usdt","🪙"],usd:["btn_pay_usd","💸"],eur:["btn_pay_eur","💰"]};
  const rows=[];
  for(let i=0;i<keys.length;i+=2){
    const a=keys[i], b=keys[i+1];
    const row=[btn(a.toUpperCase(),prefix+"-"+a,(meta[a]||[])[0],(meta[a]||[])[1])];
    if(b) row.push(btn(b.toUpperCase(),prefix+"-"+b,(meta[b]||[])[0],(meta[b]||[])[1]));
    rows.push(row);
  }
  rows.push([backBtn()]);
  return bubble(`${pe("deal_money","💰")} <b>${t("pick_cur")}</b>`)+kb(rows);
}
function screenAdminAmt(kind){
  return bubble(`${pe("deal_money","💰")} <b>${kind==="credit"?t("credit"):t("transfer")}</b><p class="hint">${t("amount")}</p><input id="a-amt" inputmode="decimal" placeholder="50" />`)+
    kb([[act(t("save"),kind==="credit"?"do-credit":"do-xfer","deal_check","✅")],[backBtn()]]);
}
function screenAdminId(kind){
  return bubble(`${pe("deal_person","👤")} <b>${t("uid")}</b><input id="a-uid" inputmode="numeric" placeholder="123456789" />`)+
    kb([[act(t("save"),"id-"+kind,"deal_check","✅")],[backBtn()]]);
}
async function draw(){
  const root=document.getElementById("screen");
  try{
    const s=state.screen;
    if(s==="home") root.innerHTML=screenHome();
    else if(s==="req") root.innerHTML=screenReq();
    else if(s==="req-ton") root.innerHTML=fieldScreen("TON","balance_ton","💎",t("ask_ton"),"f-ton",state.user.ton_wallet,"save-ton");
    else if(s==="req-card") root.innerHTML=fieldScreen(t("card"),"balance_card","💳",t("ask_card"),"f-card",state.user.card_number,"save-card");
    else if(s==="req-user") root.innerHTML=fieldScreen(t("uname"),"deal_person","👤",t("ask_user"),"f-username",state.user.payout_username,"save-username");
    else if(s==="create-role") root.innerHTML=screenCreateRole();
    else if(s.startsWith("create-type")) root.innerHTML=screenCreateType();
    else if(s.startsWith("create-pay")) root.innerHTML=screenCreatePay();
    else if(s==="create-amt") root.innerHTML=screenCreateAmt();
    else if(s==="create-desc") root.innerHTML=screenCreateDesc();
    else if(s==="create-done") root.innerHTML=screenCreateDone();
    else if(s==="bal") root.innerHTML=screenBal();
    else if(s==="wd") root.innerHTML=screenWd();
    else if(s==="deals") root.innerHTML=await screenDeals();
    else if(s==="refs") root.innerHTML=screenRefs();
    else if(s==="lang") root.innerHTML=screenLang();
    else if(s==="admin") root.innerHTML=screenAdmin();
    else if(s==="admin-credit") root.innerHTML=currencyScreen("acred");
    else if(s==="admin-xfer") root.innerHTML=currencyScreen("axfer");
    else if(s==="admin-bal") {
      const b=state.user.balances||{};
      const groups=GROUPS.map(([name,keys])=>`<b>${name}</b>`+keys.map(([k,fb,icon])=>`<div class="line">${pe(icon,fb)} ${k.toUpperCase()}: <b>${b[k]??0}</b></div>`).join("")).join("<br>");
      root.innerHTML=bubble(`${pe("deal_person","👤")} <b>${t("mybal")}</b><br><br>${groups}`)+kb([[backBtn()]]);
    }
    else if(s==="admin-amt") root.innerHTML=screenAdminAmt(state.admin.kind);
    else if(s==="admin-id") root.innerHTML=screenAdminId(state.admin.kind);
    else if(s==="admin-grant"||s==="admin-ban"||s==="admin-unban") root.innerHTML=screenAdminId(s.replace("admin-",""));
    else root.innerHTML=screenHome();
  }catch(e){root.innerHTML=bubble(`<span class="err">${esc(e.message)}</span>`)+kb([[backBtn()]]);}
  root.className="";
  void root.offsetWidth;
  root.className="panel"+(state.dir==="back"?" back":"");
}
async function loadMe(){
  const data=await api("/api/me");
  state.user=data.user;
  const sp=data.user.start_param||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"";
  if(String(sp).startsWith("deal_")){
    try{await api("/api/deals/"+sp.slice(5)+"/join",{method:"POST"});toast("Вы вошли в сделку");state.screen="deals";state.stack=["home","deals"];}catch(e){toast(e.message);}
  }
}
document.body.addEventListener("click",async(ev)=>{
  const goBtn=ev.target.closest("[data-go]");
  if(goBtn){
    ev.preventDefault();
    const name=goBtn.dataset.go;
    if(name==="create-type-seller"||name==="create-type-buyer"){state.draft.role=name.endsWith("seller")?"seller":"buyer";go("create-type");return;}
    if(name.startsWith("create-pay-")){state.draft.deal_type=name.slice(11);go("create-pay");return;}
    if(name.startsWith("create-amt-")){state.draft.pay_method=name.slice(11);go("create-amt");return;}
    if(name.startsWith("wd-")){state.wmethod=name.slice(3);go("wd");return;}
    if(name.startsWith("set-lang-")){
      try{await api("/api/language",{method:"POST",body:JSON.stringify({language:name.endsWith("en")?"en":"ru"})});await loadMe();go("home");}catch(e){toast(e.message);}
      return;
    }
    if(name.startsWith("acred-")){state.admin={kind:"credit",currency:name.slice(6)};go("admin-amt");return;}
    if(name.startsWith("axfer-")){state.admin={kind:"xfer",currency:name.slice(6)};go("admin-id");return;}
    go(name);return;
  }
  const a=ev.target.closest("[data-act]");
  if(!a) return;
  const actName=a.dataset.act;
  try{
    if(actName==="support"){const url=state.user.support_url;if(tg&&tg.openTelegramLink) tg.openTelegramLink(url);else window.open(url,"_blank");return;}
    if(actName==="go:home"){
      if(!state.user){try{await loadMe();}catch(e){toast(e.message);return;}}
      go("home");return;
    }
    if(actName.startsWith("save-")){
      const field=actName.slice(5);
      const id=field==="username"?"f-username":"f-"+field;
      const value=document.getElementById(id).value;
      const data=await api("/api/requisites",{method:"POST",body:JSON.stringify({field,value})});
      state.user={...state.user,...data.user,is_admin:state.user.is_admin,is_super_admin:state.user.is_super_admin};
      toast("Сохранено");go("req","back");return;
    }
    if(actName==="deal-amount"){state.draft.amount=document.getElementById("f-amount").value;go("create-desc");return;}
    if(actName==="deal-make"){
      state.draft.description=document.getElementById("f-desc").value;
      const data=await api("/api/deals",{method:"POST",body:JSON.stringify(state.draft)});
      state.link=data.link;go("create-done");return;
    }
    if(actName==="copy-link"||actName.startsWith("copy:")){
      const text=actName==="copy-link"?state.link:actName.slice(5);
      navigator.clipboard.writeText(text);toast("Скопировано");return;
    }
    if(actName==="do-withdraw"){
      await api("/api/withdraw",{method:"POST",body:JSON.stringify({method:state.wmethod,amount:document.getElementById("w-amount").value})});
      toast("Заявка принята");await loadMe();go("bal","back");return;
    }
    if(actName.startsWith("deal-cancel-")){await api("/api/deals/"+actName.slice(12)+"/cancel",{method:"POST"});toast("Отменено");draw();return;}
    if(actName.startsWith("deal-paybal-")){await api("/api/deals/"+actName.slice(12)+"/paybal",{method:"POST"});toast("Оплачено");draw();return;}
    if(actName.startsWith("deal-sent-")){await api("/api/deals/"+actName.slice(10)+"/sent",{method:"POST"});toast("Готово");draw();return;}
    if(actName.startsWith("deal-recv-")){await api("/api/deals/"+actName.slice(10)+"/recv",{method:"POST"});toast("Готово");draw();return;}
    if(actName==="do-credit"){
      await api("/api/admin/credit",{method:"POST",body:JSON.stringify({currency:state.admin.currency,amount:document.getElementById("a-amt").value})});
      toast("Готово");await loadMe();go("admin","back");return;
    }
    if(actName==="id-xfer"){state.admin.uid=document.getElementById("a-uid").value;go("admin-amt");return;}
    if(actName==="do-xfer"){
      await api("/api/admin/transfer",{method:"POST",body:JSON.stringify({currency:state.admin.currency,user_id:state.admin.uid,amount:document.getElementById("a-amt").value})});
      toast("Готово");go("admin","back");return;
    }
    if(actName==="id-grant"){await api("/api/admin/grant",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value})});toast("Воркер добавлен");go("admin","back");return;}
    if(actName==="id-ban"){await api("/api/admin/ban",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value,action:"ban"})});toast("Готово");go("admin","back");return;}
    if(actName==="id-unban"){await api("/api/admin/ban",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value,action:"unban"})});toast("Готово");go("admin","back");return;}
  }catch(e){toast(e.message);}
});
if(tg&&tg.BackButton){tg.BackButton.onClick(()=>back());}
(async function init(){
  let lastErr=null;
  for(let i=0;i<6;i++){
    try{
      await loadMe();
      syncBack();
      draw();
      return;
    }catch(e){
      lastErr=e;
      await new Promise(r=>setTimeout(r,300));
    }
  }
  document.getElementById("screen").innerHTML=bubble(`<b>Не удалось открыть сессию</b><p class="hint">Закрой окно и нажми «Открыть GGSel» в боте.</p>`)+kb([[act("Повторить","go:home","btn_back","🔄")]]);
})();
  </script>
</body>
