<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GGSel</title>
  <script>
  (function(){
    function save(d){ if(d) try{ sessionStorage.setItem("tg_init", d); }catch(e){} }
    try {
      var h = String(location.hash || "").replace(/^#/, "");
      save(new URLSearchParams(h).get("tgWebAppData"));
      var q = new URLSearchParams(location.search);
      save(q.get("tgWebAppData") || q.get("initData"));
    } catch (e) {}
  })();
  </script>
  <script src="/assets/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/600.css" />
  <style>
:root {
  --bg: #eef2f5;
  --card: #ffffff;
  --btn: #e6ebf0;
  --btn-press: #d5dde5;
  --line: #d8dee6;
  --text: #12151c;
  --muted: #7a8494;
  --accent: #1db954;
  --accent-hover: #17a349;
  --blue: #3d5afe;
  --danger: #e85d4c;
  --ok: #1db954;
  --ink: #161b22;
  --logo-mark-color: #1db954;
  --logo-wordmark-color: #12151c;
  --dock: #ffffff;
  --hero: #161b22;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Geist, "Geist Sans", ui-sans-serif, system-ui, sans-serif;
}
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow-x: hidden; }
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 4px;
}
.logo svg { display: block; height: 28px; width: auto; }
.chip {
  appearance: none;
  border: 0;
  background: var(--btn);
  color: var(--text);
  border-radius: 100px;
  min-height: 36px;
  padding: 0 14px;
  font: 600 13px/1 Geist, ui-sans-serif, system-ui, sans-serif;
}
.stage { flex: 1; padding: 8px 16px 28px; }
.search-like {
  display: flex;
  gap: 8px;
  margin: 4px 0 12px;
}
.chip-cat {
  appearance: none;
  border: 0;
  background: var(--btn);
  color: var(--text);
  border-radius: 100px;
  min-height: 36px;
  padding: 0 14px;
  font: 600 13px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.cats {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 14px;
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cards-h {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 0 16px;
  scrollbar-width: none;
}
.cards-h::-webkit-scrollbar { display: none; }
.feat {
  position: relative;
  overflow: hidden;
  flex: 0 0 156px;
  height: 176px;
  border: 0;
  border-radius: 20px;
  padding: 12px 14px;
  color: #fff;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.25;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  text-align: left;
  cursor: pointer;
  transform-style: preserve-3d;
  box-shadow: 0 14px 26px rgba(17,19,24,.14);
  animation: card-3d 5.4s ease-in-out infinite;
}
.feat.g { background: linear-gradient(160deg, #44cf5e 0%, #1fa34a 100%); }
.feat.d { background: linear-gradient(160deg, #2b2f38 0%, #111318 100%); }
.feat.b { background: linear-gradient(160deg, #575df6 0%, #3b40d4 100%); }
.feat.t { background: linear-gradient(160deg, #0f766e 0%, #115e59 100%); }
.feat.p { background: linear-gradient(160deg, #7c3aed 0%, #5b21b6 100%); }
.feat.s { background: linear-gradient(160deg, #0ea5e9 0%, #0369a1 100%); }
.cards-h { perspective: 720px; }
.feat:nth-child(2) { animation-delay: .25s; }
.feat:nth-child(3) { animation-delay: .5s; }
.feat:nth-child(4) { animation-delay: .75s; }
.feat:nth-child(5) { animation-delay: 1s; }
.feat:nth-child(6) { animation-delay: 1.2s; }
.feat-lab { position: relative; z-index: 2; }
.scene {
  position: absolute;
  left: 0;
  right: 0;
  top: 6px;
  height: 118px;
  pointer-events: none;
  z-index: 1;
}
.scene-svg { width: 100%; height: 100%; overflow: visible; }
.s-plus { transform-origin: 60px 48px; animation: plus-3d 2.4s ease-in-out infinite; }
.s-dot { animation: ico-bob 2.2s ease-in-out infinite; }
.s-dot.d2 { animation-delay: .4s; }
.s-paper { transform-origin: 60px 50px; animation: paper-lift 3.2s ease-in-out infinite; }
.s-paper.p2 { animation-delay: .18s; }
.s-paper.p3 { animation-delay: .36s; }
.s-coin { transform-origin: 78px 32px; animation: coin-spin 2.8s linear infinite; }
.s-wallet { transform-origin: 60px 58px; animation: well-3d 3.4s ease-in-out infinite; }
.s-card { transform-origin: 60px 50px; animation: card-tilt 3s ease-in-out infinite; }
.s-chip { animation: ico-pulse 1.8s ease-in-out infinite; }
.s-person { animation: ico-nudge 2.2s ease-in-out infinite; }
.s-person.r { animation-delay: .35s; }
.s-link { animation: link-pulse 2.4s ease-in-out infinite; transform-origin: 60px 42px; }
.s-ear { transform-origin: 60px 48px; animation: well-3d 3s ease-in-out infinite; }
.s-wave { transform-origin: 60px 48px; animation: wave-ring 2.2s ease-out infinite; }
.s-wave.w2 { animation-delay: .55s; }
@keyframes plus-3d {
  0%,100% { transform: rotateX(12deg) rotateY(-16deg) scale(1); }
  50% { transform: rotateX(-8deg) rotateY(16deg) scale(1.12); }
}
@keyframes paper-lift {
  0%,100% { transform: translateY(0) rotate(-8deg) rotateY(-12deg); }
  50% { transform: translateY(-8px) rotate(5deg) rotateY(10deg); }
}
@keyframes coin-spin {
  0% { transform: rotateY(0) translateY(0); }
  50% { transform: rotateY(180deg) translateY(-6px); }
  100% { transform: rotateY(360deg) translateY(0); }
}
@keyframes card-tilt {
  0%,100% { transform: rotateX(8deg) rotateY(-18deg) translateY(0); }
  50% { transform: rotateX(-4deg) rotateY(16deg) translateY(-6px); }
}
@keyframes link-pulse {
  0%,100% { opacity: .45; stroke-width: 4; }
  50% { opacity: 1; stroke-width: 6; }
}
@keyframes wave-ring {
  0% { transform: scale(.7); opacity: .55; }
  100% { transform: scale(1.25); opacity: 0; }
}
.fig {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 12px;
  background: #171717;
  box-shadow: 0 8px 14px rgba(17,19,24,.18), inset 0 1px 0 rgba(255,255,255,.14);
  transform-style: preserve-3d;
  overflow: visible;
}
.fig .pe, .fig .fb {
  width: 26px;
  height: 26px;
  font-size: 22px;
  line-height: 26px;
  text-align: center;
  animation: fig-3d 3.2s ease-in-out infinite;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.35));
}
.fig.lg { width: 44px; height: 44px; border-radius: 14px; flex-basis: 44px; }
.fig.lg .pe, .fig.lg .fb { width: 32px; height: 32px; font-size: 26px; line-height: 32px; }
.feat .fig {
  width: 58px;
  height: 58px;
  flex-basis: 58px;
  border-radius: 18px;
  background: rgba(17,19,24,.34);
  animation: well-3d 4.2s ease-in-out infinite;
}
.feat .fig .pe, .feat .fig .fb {
  width: 44px;
  height: 44px;
  font-size: 34px;
  line-height: 44px;
}
.chip-cat .fig, .amt-chip .fig { width: 28px; height: 28px; flex-basis: 28px; border-radius: 9px; }
.chip-cat .fig .pe, .chip-cat .fig .fb, .amt-chip .fig .pe, .amt-chip .fig .fb {
  width: 20px; height: 20px; font-size: 16px; line-height: 20px;
}
.cta .fig { background: rgba(17,19,24,.28); }
.kbtn, .tile { min-height: 52px; }
.panel-card {
  background: #f4f6f8;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 16px;
}
.panel-card .lab { color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.amt-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.amt-chip {
  background: #fff;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cta {
  appearance: none;
  width: 100%;
  border: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 14px;
  min-height: 48px;
  font: 600 15px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.cta:active { background: var(--accent-hover); }
.points { margin: 8px 0 14px; padding-left: 18px; color: var(--text); }
.points li { margin: 4px 0; }
.panel { animation: enter .32s cubic-bezier(.22,1,.36,1) both; }
.panel.back { animation: enter-back .32s cubic-bezier(.22,1,.36,1) both; }
@keyframes enter {
  from { opacity: 0; transform: translate3d(12px, 6px, 0); }
  to { opacity: 1; transform: none; }
}
@keyframes enter-back {
  from { opacity: 0; transform: translate3d(-12px, 6px, 0); }
  to { opacity: 1; transform: none; }
}
.bubble, .hero, .item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  line-height: 1.45;
  font-size: 15px;
}
.hero {
  background: #fff;
  border: 0;
  padding: 8px 0 16px;
}
.sec { font-size: 20px; font-weight: 600; margin: 8px 0 12px; }
.who { font-size: 22px; font-weight: 600; margin: 4px 0 10px; }
.bal-mini { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  background: var(--btn);
  border-radius: 100px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.bubble b { font-weight: 600; }
.muted, .hint { color: var(--muted); }
.hint { font-size: 13.5px; margin-top: 8px; }
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tile {
  min-height: 98px;
  border: 0;
  border-radius: 16px;
  padding: 14px;
  background: var(--btn);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: transform .18s ease, background .18s ease;
}
.tile:active { transform: scale(.98); background: var(--btn-press); }
.kb { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.kb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kb-row.one { grid-template-columns: 1fr; }
.kbtn, .submit {
  appearance: none;
  border: 0;
  background: var(--btn);
  border-radius: 16px;
  min-height: 48px;
  padding: 10px 12px;
  font-size: 14.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.kbtn:active, .tile:active, .submit:active, .chip:active { transform: scale(.975); }
.kbtn.danger { color: var(--danger); }
.submit, .kbtn.primary {
  background: var(--accent);
  color: #fff;
}
.submit:active, .kbtn.primary:active { background: var(--accent-hover); }
.pe { width: 22px; height: 22px; object-fit: contain; flex: 0 0 22px; }
.fig .pe { flex: none; object-fit: contain; }
.pe.lg { width: 26px; height: 26px; flex-basis: 26px; vertical-align: -5px; }
.line { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.item { border-radius: 16px; background: #fff; }
button.item {
  appearance: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.item .top { display: flex; justify-content: space-between; gap: 8px; }
input, textarea, select {
  width: 100%;
  margin-top: 8px;
  background: var(--btn);
  color: var(--text);
  border: 0;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
}
#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
  background: #171717; color: #fff; padding: 10px 14px; border-radius: 16px;
  opacity: 0; pointer-events: none; transition: .22s ease; z-index: 20; max-width: 86%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.err { color: var(--danger); }
.ok { color: var(--ok); }
.stage { flex: 1; padding: 8px 16px 120px; }
/* tabbar styles live in the redesign block below */
.logo { perspective: 420px; }
.logo-float {
  display: block;
  transform-style: preserve-3d;
  transform-origin: 18px 50%;
  animation: logo-bob 4.4s ease-in-out infinite;
  will-change: transform;
  filter: drop-shadow(0 8px 12px rgba(68,207,94,.16));
}
.logo-mark {
  transform-origin: 18px 20px;
  animation: logo-hue 9s linear infinite;
}
.chip-lang {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.chip-lang .gear {
  width: 14px;
  height: 14px;
  animation: ico-spin 7s linear infinite;
}
.tab svg { transform-origin: 50% 50%; }
.tab[data-tab="home"] svg { animation: ico-bob 2.6s ease-in-out infinite; }
.tab[data-tab="create"] svg { animation: ico-pulse 1.8s ease-in-out infinite; }
.tab[data-tab="deals"] svg { animation: ico-flip 3.2s ease-in-out infinite; }
.tab[data-tab="bal"] svg { animation: ico-coin 2.5s ease-in-out infinite; }
.tab[data-tab="req"] svg { animation: ico-tilt 2.8s ease-in-out infinite; }
.tab[data-tab="refs"] svg { animation: ico-nudge 2.4s ease-in-out infinite; }
.tab[data-tab="profile"] svg { animation: ico-bob 2.6s ease-in-out infinite; }
.tab[data-tab="support"] svg { animation: ico-pulse 2.2s ease-in-out infinite; }
.tab[data-tab="admin"] svg { animation: ico-spin 8s linear infinite; }
.tab.on { transform: translateY(-1px); }
.kbtn, .tile, .feat, .cta, .chip, .chip-cat, .lang-row {
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}
.kbtn .fig, .tile .fig, .chip-cat .fig, .cta .fig, .bubble .fig, .line .fig, .amt-chip .fig {
  animation: well-3d 4.8s ease-in-out infinite;
}
.kbtn[data-go="lang"] .fig, .kbtn[data-go="admin"] .fig, .chip-cat[data-go="lang"] .fig, .chip-cat[data-go="admin"] .fig {
  animation: well-spin 7s linear infinite;
}
.kbtn[data-go="create-role"] .fig, .cta .fig, .chip-cat[data-go="create-role"] .fig {
  animation: well-pulse 2s ease-in-out infinite;
}
.cta { box-shadow: 0 8px 18px rgba(68,207,94,.22); animation: cta-glow 2.8s ease-in-out infinite; }
.lang-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: calc(100dvh - 250px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}
.lang-row {
  appearance: none;
  border: 0;
  width: 100%;
  background: var(--btn);
  border-radius: 14px;
  min-height: 48px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
  font: 600 14.5px/1.2 Geist, ui-sans-serif, system-ui, sans-serif;
  color: var(--text);
  cursor: pointer;
}
.lang-row small { color: var(--muted); font-weight: 500; }
.lang-row.on { background: var(--accent); color: #fff; }
.lang-row.on small { color: rgba(255,255,255,.82); }
.lang-row:active { transform: scale(.985); }
#intro {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  overflow: hidden;
  contain: layout style;
  animation: intro-veil 3.4s ease both;
}
#intro[hidden] { display: none; }
.intro-stage {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.intro-logo {
  width: 92px;
  will-change: transform, opacity;
  animation: intro-shot 3.4s cubic-bezier(.22,1,.36,1) both;
}
.intro-logo svg { width: 100%; height: auto; display: block; }
.intro-logo .logo-mark { animation: none; }
.intro-letters {
  margin-top: 18px;
  display: flex;
  gap: 1px;
  font: 800 40px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  letter-spacing: -.06em;
  color: #171717;
}
.intro-letters span {
  display: inline-block;
  opacity: 0;
  animation: letter-fly .9s cubic-bezier(.22,1,.36,1) forwards;
}
.intro-letters span:nth-child(1) { animation-delay: .72s; }
.intro-letters span:nth-child(2) { animation-delay: .84s; }
.intro-letters span:nth-child(3) { animation-delay: .96s; }
.intro-letters span:nth-child(4) { animation-delay: 1.08s; }
.intro-letters span:nth-child(5) { animation-delay: 1.2s; }
.fog {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(ellipse 90% 60% at 28% 42%, #fff 0%, rgba(255,255,255,.7) 38%, transparent 68%),
    radial-gradient(ellipse 80% 70% at 78% 58%, #fff 0%, rgba(244,246,248,.85) 40%, transparent 70%);
  animation: intro-fog 3.4s ease both;
}
.nft-card {
  appearance: none;
  width: 100%;
  border: 0;
  background: #111318;
  color: #fff;
  border-radius: 18px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  cursor: pointer;
  margin: 10px 0 14px;
}
.nft-card img {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  object-fit: cover;
  background: #2b2f38;
  flex: 0 0 64px;
}
.nft-card b { display: block; font-size: 16px; }
.nft-card .hint { color: #b8bec8; word-break: break-all; }
.deal-link-box {
  background: #f4f6f8;
  border-radius: 16px;
  padding: 12px;
  margin: 12px 0;
}
.deal-link-box .lab { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.deal-link-box input {
  margin: 0;
  background: #fff;
  color: #171717;
  font-size: 14px;
  font-weight: 600;
  word-break: break-all;
}
.kv { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0; font-size: 14.5px; }
.kv span { color: var(--muted); }
.kv b { text-align: right; }
.status-pill {
  display: inline-flex;
  background: #eff2f6;
  border-radius: 100px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
}
.status-pill.ok {
  background: #e7f8ec;
  color: #148a3c;
}
.status-ok { color: var(--ok); font-weight: 700; }
.avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #44cf5e;
  color: #fff;
  display: grid;
  place-items: center;
  font: 700 22px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  margin-bottom: 12px;
}
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.stat {
  background: #f4f6f8;
  border-radius: 16px;
  padding: 12px;
}
.stat .n { font-size: 20px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 12px; font-weight: 600; }
@keyframes logo-bob {
  0%,100% { transform: translate3d(0,0,0) rotateX(8deg) rotateY(-10deg); }
  50% { transform: translate3d(0,-6px,8px) rotateX(-4deg) rotateY(12deg); }
}
@keyframes logo-hue {
  from { filter: hue-rotate(0deg) saturate(1.2); }
  to { filter: hue-rotate(360deg) saturate(1.2); }
}
@keyframes ico-spin { to { transform: rotate(360deg); } }
@keyframes ico-bob {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes ico-pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
@keyframes ico-flip {
  0%,100% { transform: rotateY(0deg); }
  50% { transform: rotateY(18deg); }
}
@keyframes ico-coin {
  0%,100% { transform: rotate(-8deg); }
  50% { transform: rotate(10deg); }
}

      clone.removeAttribute("width");
      clone.removeAttribute("height");
      clone.setAttribute("viewBox","0 0 40 40");
      clone.setAttribute("width","92");

      clone.querySelectorAll("path").forEach((p,i)=>{ if(i>0) p.remove(); });
      host.appendChild(clone);

  el.hidden=false;
  el.style.animation="none";
  if(host) host.style.animation="none";
  const fog=el.querySelector(".fog");
  if(fog) fog.style.animation="none";
  letters.forEach(sp=>sp.style.animation="none");
  void el.offsetWidth;
  el.style.animation="";

      if(r.joined) toast("Вы вошли в сделку");

    else if(s==="lang") root.innerHTML=screenLang();
    else if(s==="admin") root.innerHTML=await screenAdmin();
    else if(s==="admin-credit") root.innerHTML=currencyScreen("acred");
    else if(s==="admin-xfer") root.innerHTML=currencyScreen("axfer");
    else if(s==="admin-bal") {
      const b=state.user.balances||{};
      const groups=GROUPS.map(([name,keys])=>`<b>${name}</b>`+keys.map(([k,fb,icon])=>`<div class="line">${pe(icon,fb)} ${k.toUpperCase()}: <b>${b[k]??0}</b></div>`).join("")).join("<br>");
      root.innerHTML=bubble(`${pe("deal_person","👤")} <b>${t("mybal")}</b><br><br>${groups}`)+kb([[backBtn()]]);
    }
    else if(s==="admin-amt") root.innerHTML=screenAdminAmt(state.admin.kind);
    else if(s==="admin-id") root.innerHTML=screenAdminId(state.admin.kind);
    else if(s==="admin-grant"||s==="admin-ban"||s==="admin-unban") root.innerHTML=screenAdminId(s.replace("admin-",""));
    else root.innerHTML=await screenHome();
  }catch(e){root.innerHTML=bubble(`<span class="err">${esc(e.message)}</span>`)+kb([[backBtn()]]);}
  if(!opts.quiet){
    root.className="";
    void root.offsetWidth;
    root.className="panel"+(state.dir==="back"?" back":"");
  }
  syncTabs();
  watchDeal();
}
function dealFingerprint(d){
  if(!d) return "";
  return [d.code,d.status,d.role||"",d.buyer_id||"",d.seller_id||"",d.amount].join("|");
}
function dealsFingerprint(list){
  return (list||[]).map(d=>[d.code,d.status,d.role||""].join(":")).join(",");
}
let dealWatch=null;
function homeFingerprint(market,feed,reviews,cur,val){
  const m=(market||[]).map(x=>[x.code,x.status,x.amount,x.owner_id||x.seller_id||""].join(":")).join(",");
  const f=(feed||[]).map(x=>x.id).join(",");
  const r=(reviews||[]).map(x=>x.id).join(",");
  return [m,f,r,cur,val].join("|");
}
function watchDeal(){
  clearInterval(dealWatch);
  dealWatch=null;
  const s=state.screen;
  if(s==="deal-view"&&state.dealCode) dealWatch=setInterval(refreshOpenDeal,2000);
  else if(s==="deals") dealWatch=setInterval(refreshDealsList,2500);
  else if(s==="home") dealWatch=setInterval(refreshHomeLive,3000);
  else if(s==="market-view") dealWatch=setInterval(refreshMarketView,4000);
}
async function refreshHomeLive(){
  if(state.screen!=="home") return;
  try{
    const cur=state.balCur||"rub";
    const b=(state.user&&state.user.balances)||{};
    const val=b[cur];
    const [market,feed,reviews]=await Promise.all([
      api("/api/market").then(r=>r.items||[]).catch(()=>state.market||[]),
      api("/api/feed").then(r=>r.items||[]).catch(()=>state.feed||[]),
      api("/api/reviews").then(r=>r.reviews||[]).catch(()=>state.reviews||[]),
    ]);
    const fp=homeFingerprint(market,feed,reviews,cur,val);
    if(fp===state.homeSig) return;
    state.market=market; state.feed=feed; state.reviews=reviews; state.homeSig=fp;
    await draw({quiet:true});
  }catch(e){}
}
async function refreshMarketView(){
  if(state.screen!=="market-view"||!state.marketCode) return;
  try{
    const list=((await api("/api/market")).items)||[];
    const still=list.some(x=>x.code===state.marketCode);
    if(!still) await draw({quiet:true});
  }catch(e){}
}
async function refreshOpenDeal(){
  if(state.screen!=="deal-view"||!state.dealCode) return;
  try{
    const d=(await api("/api/deals/"+state.dealCode)).deal;
    const fp=dealFingerprint(d);
    if(fp===state.dealSig) return;
    state.deal=d;
    state.dealSig=fp;
    await draw({quiet:true});
  }catch(e){}
}
async function refreshDealsList(){
  if(state.screen!=="deals") return;
  try{
    const {deals}=await api("/api/deals");
    const fp=dealsFingerprint(deals);
    if(fp===state.dealsSig) return;
    state.deals=deals;
    state.dealsSig=fp;
    await draw({quiet:true});
  }catch(e){}
}
let bootDealDone=false;
async function loadMe(opts={}){
  const boot=bootParams();
  const setlang=boot.setlang;
  const saved=rememberedLang();
  let data=await api("/api/me");
  state.user=data.user;
  if(Number(state.user.lang_picked)&&state.user.language){
    rememberLang(state.user.language);
  }else if(saved){
    try{
      await api("/api/language",{method:"POST",body:JSON.stringify({language:saved,deal:boot.deal||""})});
      data=await api("/api/me");
      state.user=data.user;
    }catch(e){}
  }else if(/^[a-z]{2,3}(?:-[a-z0-9]{2,8})?$/.test(setlang)){
    try{
      await api("/api/language",{method:"POST",body:JSON.stringify({language:setlang,deal:boot.deal||""})});
      rememberLang(setlang);
      data=await api("/api/me");
      state.user=data.user;
    }catch(e){}
  }
  syncLangChip();
}
document.body.addEventListener("click",async(ev)=>{
  const goBtn=ev.target.closest("[data-go]");
  if(goBtn){
    ev.preventDefault();
    const name=goBtn.dataset.go;
    if(name==="create-type-seller"||name==="create-type-buyer"){state.draft.role=name.endsWith("seller")?"seller":"buyer";go("create-type");return;}
    if(name.startsWith("create-pay-")){state.draft.deal_type=name.slice(11);go("create-pay");return;}
    if(name.startsWith("create-amt-")){state.draft.pay_method=name.slice(11);go("create-amt");return;}
    if(name.startsWith("wd-")){state.wmethod=name.slice(3);go("wd");return;}
    if(name.startsWith("set-lang-")){
      await pickLanguage(name.endsWith("en")?"en":"ru");
      return;
    }
    if(name.startsWith("acred-")){state.admin={kind:"credit",currency:name.slice(6)};go("admin-amt");return;}
    if(name.startsWith("axfer-")){state.admin={kind:"xfer",currency:name.slice(6)};go("admin-id");return;}
    go(name);return;
  }
  const a=ev.target.closest("[data-act]");
  if(!a) return;
  const actName=a.dataset.act;
  try{
    if(actName==="pick-lang"){await pickLanguage(a.dataset.lang);return;}
    if(actName==="bal-cur"){state.balCur=a.dataset.cur||"rub";await draw({quiet:true});return;}
    if(actName==="open-feed"){
      state.feedId=Number(a.dataset.id)||null;
      if(!state.feedId) return;
      go("feed-view");return;
    }
    if(actName==="join-deal"){go("join");return;}
    if(actName==="do-join"){
      const raw=(document.getElementById("join-code")||{}).value||"";
      const clean=String(raw).trim().replace(/^deal[_-]?/i,"");
      if(!clean){toast(uiLang()==="en"?"Enter code":"Введите код");return;}
      const r=await api("/api/deals/"+clean+"/join",{method:"POST"});
      if(r.joined) toast(uiLang()==="en"?"Joined":"Вы вошли в сделку");
      state.dealCode=clean;go("deal-view");return;
    }
    if(actName==="rev-add"){
      const body={
        username:(document.getElementById("rv-user")||{}).value||"",
        rating:(document.getElementById("rv-rating")||{}).value||5,
        body:(document.getElementById("rv-body")||{}).value||"",
        nft_url:(document.getElementById("rv-nft")||{}).value||"",
        deal_code:(document.getElementById("rv-deal")||{}).value||"",
        date:(document.getElementById("rv-date")||{}).value||""
      };
      await api("/api/admin/reviews",{method:"POST",body:JSON.stringify(body)});
      toast("OK");go("admin");return;
    }
    if(actName==="rev-del"){await api("/api/admin/reviews/"+a.dataset.id+"/delete",{method:"POST",body:"{}"});go("admin");return;}
    if(actName==="rev-up"||actName==="rev-down"){
      await api("/api/admin/reviews/"+a.dataset.id+"/move",{method:"POST",body:JSON.stringify({direction:actName==="rev-up"?"up":"down"})});
      go("admin");return;
    }
    if(actName==="rev-sort"){state.reviewSort=a.dataset.sort||"new";go("admin");return;}
    if(actName==="rev-star"){
      const n=Math.max(1,Math.min(5,Number(a.dataset.n)||5));
      const rating=document.getElementById("rv-rating");
      if(rating) rating.value=String(n);
      document.querySelectorAll(".star-pick button").forEach((b,i)=>b.classList.toggle("on", i<n));
      return;
    }
    if(actName==="rev-rand"){fillRandomReview();haptic();return;}
    if(actName==="rev-bulk"){
      for(let i=0;i<5;i++){
        const pick=REVIEW_POOL[(Math.floor(Math.random()*REVIEW_POOL.length)+i)%REVIEW_POOL.length];
        await api("/api/admin/reviews",{method:"POST",body:JSON.stringify({username:pick[0],rating:5,body:pick[1],date:pick[2]})});
      }
      toast(uiLang()==="en"?"5 reviews added":"Добавлено 5 отзывов");
      go("admin");return;
    }
    if(actName==="support"){const url=state.user.support_url;if(tg&&tg.openTelegramLink) tg.openTelegramLink(url);else window.open(url,"_blank");return;}
    if(actName==="go:home"){
      if(!state.user){try{await loadMe();}catch(e){toast(e.message);return;}}
      go("home");return;
    }
    if(actName.startsWith("save-")){
      const field=actName.slice(5);
      const id=field==="username"?"f-username":"f-"+field;
      const value=document.getElementById(id).value;
      const data=await api("/api/requisites",{method:"POST",body:JSON.stringify({field,value})});
      state.user={...state.user,...data.user,is_admin:state.user.is_admin,is_super_admin:state.user.is_super_admin};
      toast("Сохранено");go("req","back");return;
    }
    if(actName==="deal-amount"){
      const n=parseAmount((document.getElementById("f-amount")||{}).value);
      if(n==null){toast("Введите сумму числом, например 100");return;}
      state.draft.amount=n;go("create-desc");return;
    }
    if(actName==="deal-make"){
      state.draft.description=(document.getElementById("f-desc")||{}).value||"";
      const n=parseAmount(state.draft.amount);
      if(n==null){toast("Введите сумму сделки");go("create-amt");return;}
      const data=await api("/api/deals",{method:"POST",body:JSON.stringify({...state.draft,amount:n})});
      state.dealCode=(data.deal&&data.deal.code)||"";
      state.link=data.link||(data.deal&&data.deal.link)||dealLink(state.dealCode);
      go("deal-view");return;
    }
    if(actName==="open-market"){
      state.marketCode=a.dataset.code||"";
      if(!state.marketCode) return;
      go("market-view");return;
    }
    if(actName==="buy-market"){
      const code=a.dataset.code||state.marketCode||"";
      if(!code) return;
      try{
        const r=await api("/api/deals/"+code+"/join",{method:"POST"});
        if(r.joined) toast(uiLang()==="en"?"Joined deal":"Вы вошли в сделку");
      }catch(e){ toast(e.message); }
      state.dealCode=code;
      go("deal-view");return;
    }
    if(actName==="open-deal"){
      state.dealCode=a.dataset.code||"";
      go("deal-view");return;
    }
    if(actName==="open-nft"){
      const url=a.dataset.url;
      if(tg&&tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url,"_blank");
      return;
    }
    if(actName==="copy-link"||actName.startsWith("copy:")){
      const text=actName==="copy-link"?(state.link||dealLink(state.dealCode)):actName.slice(5);
      copyText(text);toast("Скопировано");return;
    }
    if(actName==="do-withdraw"){
      await api("/api/withdraw",{method:"POST",body:JSON.stringify({method:state.wmethod,amount:document.getElementById("w-amount").value})});
      toast("Заявка принята");await loadMe();go("bal","back");return;
    }
    if(actName.startsWith("deal-cancel-")){
      const r=await api("/api/deals/"+actName.slice(12)+"/cancel",{method:"POST"});
      toast("Отменено");state.dealCode=actName.slice(12);if(r.deal){state.deal=r.deal;state.dealSig=dealFingerprint(r.deal);}
      go("deal-view");return;
    }
    if(actName.startsWith("deal-paybal-")){
      const r=await api("/api/deals/"+actName.slice(12)+"/paybal",{method:"POST"});
      toast("Оплачено");state.dealCode=actName.slice(12);if(r.deal){state.deal=r.deal;state.dealSig=dealFingerprint(r.deal);}
      await loadMe();go("deal-view");return;
    }
    if(actName.startsWith("deal-sent-")){
      const r=await api("/api/deals/"+actName.slice(10)+"/sent",{method:"POST"});
      toast("Готово");state.dealCode=actName.slice(10);if(r.deal){state.deal=r.deal;state.dealSig=dealFingerprint(r.deal);}
      go("deal-view");return;
    }
    if(actName.startsWith("deal-recv-")){
      const r=await api("/api/deals/"+actName.slice(10)+"/recv",{method:"POST"});
      toast("Готово");state.dealCode=actName.slice(10);if(r.deal){state.deal=r.deal;state.dealSig=dealFingerprint(r.deal);}
      await loadMe();go("deal-view");return;
    }
    if(actName==="do-credit"){
      await api("/api/admin/credit",{method:"POST",body:JSON.stringify({currency:state.admin.currency,amount:document.getElementById("a-amt").value})});
      toast("Готово");await loadMe();go("admin","back");return;
    }
    if(actName==="id-xfer"){state.admin.uid=document.getElementById("a-uid").value;go("admin-amt");return;}
    if(actName==="do-xfer"){
      await api("/api/admin/transfer",{method:"POST",body:JSON.stringify({currency:state.admin.currency,user_id:state.admin.uid,amount:document.getElementById("a-amt").value})});
      toast("Готово");go("admin","back");return;
    }
    if(actName==="id-grant"){await api("/api/admin/grant",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value})});toast("Воркер добавлен");go("admin","back");return;}
    if(actName==="id-ban"){await api("/api/admin/ban",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value,action:"ban"})});toast("Готово");go("admin","back");return;}
    if(actName==="id-unban"){await api("/api/admin/ban",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value,action:"unban"})});toast("Готово");go("admin","back");return;}
  }catch(e){toast(e.message);}
});
document.body.addEventListener("input",(ev)=>{
  if(ev.target&&ev.target.id==="lang-q") filterLangs();
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  if(state.screen==="deal-view") refreshOpenDeal();
  else if(state.screen==="deals") refreshDealsList();
  else if(state.screen==="home") refreshHomeLive();
  else if(state.screen==="market-view") refreshMarketView();
});
if(tg&&tg.BackButton){tg.BackButton.onClick(()=>back());}
(async function init(){
  const intro=playIntro();
  let lastErr=null;
  for(let i=0;i<8;i++){
    try{
      await loadMe();
      await intro;
      if(needLangPicker()){
        state.screen="lang";
        state.stack=["lang"];
      } else {
        await enterApp();
      }
      syncLangChip();
      syncBack();
      await draw();
      return;
    }catch(e){
      lastErr=e;
      await new Promise(r=>setTimeout(r,250));
    }
  }
  try{await intro;}catch(e){}
  document.getElementById("screen").innerHTML=bubble(`<b>Не удалось открыть сессию</b><p class="hint">Закрой окно и нажми «Выбрать язык» в боте.</p>`)+kb([[act("Повторить","go:home","btn_back","🔄")]]);
})();
  </script>
