<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>GGSel</title>
  <script>
  (function(){
    function save(d){ if(d) try{ sessionStorage.setItem("tg_init", d); }catch(e){} }
    try {
      var h = String(location.hash || "").replace(/^#/, "");
      save(new URLSearchParams(h).get("tgWebAppData"));
      var q = new URLSearchParams(location.search);
      save(q.get("tgWebAppData") || q.get("initData"));
    } catch (e) {}
  })();
  </script>
  <script src="/assets/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/600.css" />
  <style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --btn: #eff2f6;
  --btn-press: #d4dae2;
  --line: #e0e2e6;
  --text: #171717;
  --muted: #848e9c;
  --accent: #44cf5e;
  --accent-hover: #3bb853;
  --blue: #575df6;
  --danger: #e8634c;
  --ok: #44cf5e;
  --logo-mark-color: #44cf5e;
  --logo-wordmark-color: #171717;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Geist, "Geist Sans", ui-sans-serif, system-ui, sans-serif;
}
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow-x: hidden; }
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 4px;
}
.logo svg { display: block; height: 28px; width: auto; }
.chip {
  appearance: none;
  border: 0;
  background: var(--btn);
  color: var(--text);
  border-radius: 100px;
  min-height: 36px;
  padding: 0 14px;
  font: 600 13px/1 Geist, ui-sans-serif, system-ui, sans-serif;
}
.stage { flex: 1; padding: 8px 16px 28px; }
.search-like {
  display: flex;
  gap: 8px;
  margin: 4px 0 12px;
}
.chip-cat {
  appearance: none;
  border: 0;
  background: var(--btn);
  color: var(--text);
  border-radius: 100px;
  min-height: 36px;
  padding: 0 14px;
  font: 600 13px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.cats {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 14px;
  scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cards-h {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 0 16px;
  scrollbar-width: none;
}
.cards-h::-webkit-scrollbar { display: none; }
.feat {
  flex: 0 0 148px;
  height: 168px;
  border: 0;
  border-radius: 20px;
  padding: 14px;
  color: #fff;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.25;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  cursor: pointer;
}
.feat.g { background: linear-gradient(160deg, #44cf5e 0%, #1fa34a 100%); }
.feat.d { background: linear-gradient(160deg, #2b2f38 0%, #111318 100%); }
.feat.b { background: linear-gradient(160deg, #575df6 0%, #3b40d4 100%); }
.feat.t { background: linear-gradient(160deg, #0f766e 0%, #115e59 100%); }
.feat.p { background: linear-gradient(160deg, #7c3aed 0%, #5b21b6 100%); }
.feat.s { background: linear-gradient(160deg, #0ea5e9 0%, #0369a1 100%); }
.feat .pe { width: 28px; height: 28px; flex-basis: 28px; }
.panel-card {
  background: #f4f6f8;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 16px;
}
.panel-card .lab { color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.amt-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.amt-chip {
  background: #fff;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cta {
  appearance: none;
  width: 100%;
  border: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 14px;
  min-height: 48px;
  font: 600 15px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.cta:active { background: var(--accent-hover); }
.points { margin: 8px 0 0; padding-left: 18px; color: var(--text); }
.points li { margin: 4px 0; }
.panel { animation: enter .32s cubic-bezier(.22,1,.36,1) both; }
.panel.back { animation: enter-back .32s cubic-bezier(.22,1,.36,1) both; }
@keyframes enter {
  from { opacity: 0; transform: translate3d(12px, 6px, 0); }
  to { opacity: 1; transform: none; }
}
@keyframes enter-back {
  from { opacity: 0; transform: translate3d(-12px, 6px, 0); }
  to { opacity: 1; transform: none; }
}
.bubble, .hero, .item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  line-height: 1.45;
  font-size: 15px;
}
.hero {
  background: #fff;
  border: 0;
  padding: 8px 0 16px;
}
.sec { font-size: 20px; font-weight: 600; margin: 8px 0 12px; }
.who { font-size: 22px; font-weight: 600; margin: 4px 0 10px; }
.bal-mini { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  background: var(--btn);
  border-radius: 100px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.bubble b { font-weight: 600; }
.muted, .hint { color: var(--muted); }
.hint { font-size: 13.5px; margin-top: 8px; }
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tile {
  min-height: 98px;
  border: 0;
  border-radius: 16px;
  padding: 14px;
  background: var(--btn);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: transform .18s ease, background .18s ease;
}
.tile:active { transform: scale(.98); background: var(--btn-press); }
.kb { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.kb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kb-row.one { grid-template-columns: 1fr; }
.kbtn, .submit {
  appearance: none;
  border: 0;
  background: var(--btn);
  border-radius: 16px;
  min-height: 48px;
  padding: 10px 12px;
  font-size: 14.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.kbtn:active, .tile:active, .submit:active, .chip:active { transform: scale(.975); }
.kbtn.danger { color: var(--danger); }
.submit, .kbtn.primary {
  background: var(--accent);
  color: #fff;
}
.submit:active, .kbtn.primary:active { background: var(--accent-hover); }
.pe { width: 22px; height: 22px; object-fit: contain; flex: 0 0 22px; }
.pe.lg { width: 26px; height: 26px; flex-basis: 26px; vertical-align: -5px; }
.line { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.item { border-radius: 16px; background: #fff; }
button.item {
  appearance: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.item .top { display: flex; justify-content: space-between; gap: 8px; }
input, textarea, select {
  width: 100%;
  margin-top: 8px;
  background: var(--btn);
  color: var(--text);
  border: 0;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 16px;
  font-family: inherit;
}
#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
  background: #171717; color: #fff; padding: 10px 14px; border-radius: 16px;
  opacity: 0; pointer-events: none; transition: .22s ease; z-index: 20; max-width: 86%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.err { color: var(--danger); }
.ok { color: var(--ok); }
.stage { flex: 1; padding: 8px 16px 120px; }
.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 16;
  display: flex;
  align-items: center;
  gap: 2px;
  background: #1c1c1e;
  border-radius: 28px;
  padding: 8px 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.16);
  max-width: min(480px, calc(100vw - 16px));
  overflow-x: auto;
  scrollbar-width: none;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab {
  appearance: none;
  border: 0;
  background: transparent;
  color: #8e8e93;
  min-width: 44px;
  padding: 4px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  flex: 0 0 auto;
}
.tab svg { width: 20px; height: 20px; fill: currentColor; }
.tab.on { color: #fff; }
.tab:active { transform: scale(.96); }
.tab.admin-only { display: none; }
.tabbar.admin .tab.admin-only { display: flex; }
.tabbar.off { pointer-events: none; opacity: .45; }
.tabbar.hide { pointer-events: none; opacity: 0; visibility: hidden; }
.logo { perspective: 420px; }
.logo-float {
  display: block;
  transform-style: preserve-3d;
  transform-origin: 18px 50%;
  animation: logo-bob 4.4s ease-in-out infinite;
  will-change: transform;
  filter: drop-shadow(0 8px 12px rgba(68,207,94,.16));
}
.logo-mark {
  transform-origin: 18px 20px;
  animation: logo-hue 9s linear infinite;
}
.chip-lang {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.chip-lang .gear {
  width: 14px;
  height: 14px;
  animation: ico-spin 7s linear infinite;
}
.tab svg { transform-origin: 50% 50%; }
.tab[data-tab="home"] svg { animation: ico-bob 2.6s ease-in-out infinite; }
.tab[data-tab="create"] svg { animation: ico-pulse 1.8s ease-in-out infinite; }
.tab[data-tab="deals"] svg { animation: ico-flip 3.2s ease-in-out infinite; }
.tab[data-tab="bal"] svg { animation: ico-coin 2.5s ease-in-out infinite; }
.tab[data-tab="req"] svg { animation: ico-tilt 2.8s ease-in-out infinite; }
.tab[data-tab="refs"] svg { animation: ico-nudge 2.4s ease-in-out infinite; }
.tab[data-tab="support"] svg { animation: ico-pulse 2.2s ease-in-out infinite; }
.tab[data-tab="admin"] svg { animation: ico-spin 8s linear infinite; }
.tab.on { transform: translateY(-1px); }
.kbtn, .tile, .feat, .cta, .chip, .chip-cat, .lang-row {
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}
.kbtn .pe, .tile .pe, .feat .pe { animation: ico-bob 2.8s ease-in-out infinite; }
.kbtn[data-go="lang"] .pe, .kbtn[data-go="admin"] .pe { animation: ico-spin 7s linear infinite; }
.kbtn[data-go="create-role"] .pe, .cta .pe { animation: ico-pulse 1.8s ease-in-out infinite; }
.kbtn[data-go="bal"] .pe { animation: ico-coin 2.4s ease-in-out infinite; }
.kbtn[data-go="deals"] .pe { animation: ico-flip 3s ease-in-out infinite; }
.kbtn[data-go="req"] .pe { animation: ico-tilt 2.8s ease-in-out infinite; }
.kbtn[data-go="refs"] .pe { animation: ico-nudge 2.4s ease-in-out infinite; }
.chip-cat .pe { animation: ico-bob 2.8s ease-in-out infinite; }
.chip-cat[data-go="lang"] .pe, .chip-cat[data-go="admin"] .pe { animation: ico-spin 7s linear infinite; }
.chip-cat[data-go="create-role"] .pe { animation: ico-pulse 1.8s ease-in-out infinite; }
.chip-cat[data-go="bal"] .pe { animation: ico-coin 2.4s ease-in-out infinite; }
.chip-cat[data-go="deals"] .pe { animation: ico-flip 3s ease-in-out infinite; }
.chip-cat[data-go="req"] .pe { animation: ico-tilt 2.8s ease-in-out infinite; }
.chip-cat[data-go="refs"] .pe { animation: ico-nudge 2.4s ease-in-out infinite; }
.feat { animation: feat-idle 5.2s ease-in-out infinite; }
.feat:nth-child(2) { animation-delay: .35s; }
.feat:nth-child(3) { animation-delay: .7s; }
.feat:nth-child(4) { animation-delay: 1s; }
.cta { box-shadow: 0 8px 18px rgba(68,207,94,.2); animation: cta-glow 2.8s ease-in-out infinite; }
.lang-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: calc(100dvh - 250px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}
.lang-row {
  appearance: none;
  border: 0;
  width: 100%;
  background: var(--btn);
  border-radius: 14px;
  min-height: 48px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
  font: 600 14.5px/1.2 Geist, ui-sans-serif, system-ui, sans-serif;
  color: var(--text);
  cursor: pointer;
}
.lang-row small { color: var(--muted); font-weight: 500; }
.lang-row.on { background: var(--accent); color: #fff; }
.lang-row.on small { color: rgba(255,255,255,.82); }
.lang-row:active { transform: scale(.985); }
#intro {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fff;
  perspective: 640px;
}
#intro[hidden] { display: none; }
.intro-orb {
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(68,207,94,.28), rgba(87,93,246,.08) 62%, transparent 70%);
  animation: orb-pulse 2.4s ease-in-out infinite;
  pointer-events: none;
}
.intro-mark {
  width: 118px;
  height: auto;
  transform-style: preserve-3d;
  animation: intro-spin 1.15s cubic-bezier(.22,1,.36,1) both, logo-hue 6s linear infinite;
  filter: drop-shadow(0 14px 22px rgba(68,207,94,.28));
}
.intro-word {
  margin-top: 14px;
  font: 700 22px/1 Geist, ui-sans-serif, system-ui, sans-serif;
  letter-spacing: -.03em;
  animation: intro-fade 1s .2s both;
}
#intro.out { animation: intro-leave .38s ease forwards; }
@keyframes logo-bob {
  0%,100% { transform: translate3d(0,0,0) rotateX(8deg) rotateY(-10deg); }
  50% { transform: translate3d(0,-6px,8px) rotateX(-4deg) rotateY(12deg); }
}
@keyframes logo-hue {
  from { filter: hue-rotate(0deg) saturate(1.2); }
  to { filter: hue-rotate(360deg) saturate(1.2); }
}
@keyframes ico-spin { to { transform: rotate(360deg); } }
@keyframes ico-bob {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes ico-pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
@keyframes ico-flip {
  0%,100% { transform: rotateY(0deg); }
  50% { transform: rotateY(18deg); }
}
@keyframes ico-coin {
  0%,100% { transform: rotate(-8deg); }
  50% { transform: rotate(10deg); }
}
@keyframes ico-tilt {
  0%,100% { transform: rotate(-4deg) translateY(0); }
  50% { transform: rotate(4deg) translateY(-1px); }
}
@keyframes ico-nudge {
  0%,100% { transform: translateX(0); }
  50% { transform: translateX(2px); }
}
@keyframes feat-idle {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@keyframes cta-glow {
  0%,100% { box-shadow: 0 8px 18px rgba(68,207,94,.18); }
  50% { box-shadow: 0 12px 24px rgba(68,207,94,.34); }
}
@keyframes intro-spin {
  from { transform: translateY(28px) rotateY(-88deg) scale(.72); opacity: 0; }
  to { transform: translateY(0) rotateY(14deg) scale(1); opacity: 1; }
}
@keyframes intro-fade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes intro-leave {
  to { opacity: 0; transform: scale(.96); }
}
@keyframes orb-pulse {
  0%,100% { transform: scale(1); opacity: .85; }
  50% { transform: scale(1.08); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .logo-float, .logo-mark, .tab svg, .kbtn .pe, .tile .pe, .feat, .cta, .chip-lang .gear, .intro-mark, .intro-orb {
    animation: none !important;
  }
}
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo" aria-label="ggsel">
        <div class="logo-float">

function readInitData(){
  const fromTg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData;
  if(fromTg){try{sessionStorage.setItem("tg_init",fromTg);}catch(e){} return fromTg;}
  const stored=sessionStorage.getItem("tg_init")||"";
  if(stored) return stored;
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));
    const v=h.get("tgWebAppData");
    if(v){sessionStorage.setItem("tg_init",v);return v;}
  }catch(e){}
  try{
    const q=new URLSearchParams(location.search);
    const v=q.get("tgWebAppData")||q.get("initData");
    if(v){sessionStorage.setItem("tg_init",v);return v;}
  }catch(e){}
  return "";
}
function bootParams(){
  const q=new URLSearchParams(location.search);
  const m=String(location.pathname||"").match(/^\/l\/([a-z]{2,8}(?:-[a-z0-9]+)?)(?:\/deal\/([A-Za-z0-9]+))?/i);
  const d=String(location.pathname||"").match(/^\/deal\/([A-Za-z0-9]+)/i);
  const pick=String(q.get("picklang")||"").toLowerCase();
  return {
    setlang:((m&&m[1])||q.get("setlang")||"").toLowerCase(),
    deal:(m&&m[2])||(d&&d[1])||q.get("deal")||"",
    picklang:pick==="1"||pick==="true"||pick==="yes"
  };
}
async function waitInitData(){

  return readInitData();
}

    if(d.status==="open"&&d.role) actions+=act(t("cancel"),"deal-cancel-"+d.code,"btn_cancel","❌","danger");
    if(d.status==="active"&&d.role==="buyer") actions+=act("Оплатить с баланса","deal-paybal-"+d.code,"deal_money","💰");
    if(d.status==="paid"&&d.role==="seller") actions+=act("Товар передан гаранту","deal-sent-"+d.code,"btn_deal_sent","📦");
    if(d.status==="goods_sent"&&d.role==="buyer") actions+=act("Подтвердить получение","deal-recv-"+d.code,"btn_deal_recv","✅");
    return `<div class="item"><div class="top"><b>#${esc(d.code)}</b><span class="muted">${esc(d.status)}</span></div><div class="hint">${esc(d.deal_type)} · ${esc(d.pay_method)} · ${d.amount} · ${esc(d.role)}</div><div class="hint">${esc(d.description)}</div><div class="kb" style="margin-top:8px">${actions}</div></div>`;
  }).join("");
  return bubble(`${pe("btn_deals","📑")} <b>${t("deals")}</b>`)+`<div class="list">${cards}</div>`+kb([[backBtn()]]);
}
function screenRefs(){
  const u=state.user;
  const link=u.bot_username?`https://t.me/${u.bot_username}?start=${u.id}`:"";
  return bubble(`${pe("btn_refs","🌐")} <b>${t("refs")}</b><p>${t("refsText")}</p><p>${t("invited")}: <b>${u.referral_count}</b></p><p class="hint">${t("refs_link")}</p><input readonly value="${esc(link)}" />`)+
    kb([[act(t("copy"),"copy:"+link,"deal_link","🔗")],[backBtn()]]);
}
function screenLang(){
  const cur=String((state.user&&state.user.language)||"");
  const rows=WORLD_LANGS.map(([code,native,en])=>{
    const q=`${code} ${native} ${en}`.toLowerCase();
    return `<button type="button" class="lang-row${cur===code?" on":""}" data-act="pick-lang" data-lang="${esc(code)}" data-q="${esc(q)}"><span>${esc(native)}</span><small>${esc(en)} · ${esc(code.toUpperCase())}</small></button>`;
  }).join("");
  const showBack=!!rememberedLang();
  return bubble(`<b>${t("pick_lang")}</b><p class="hint">${t("all_langs")}</p><input id="lang-q" type="search" autocomplete="off" placeholder="${esc(t("search_lang"))}" />`)+
    `<div class="lang-list" id="lang-list">${rows}</div>`+
    (showBack?kb([[backBtn()]]):"");
}
function screenAdmin(){
  const u=state.user;
  if(!u.is_admin) return bubble("Нет доступа")+kb([[backBtn()]]);
  const rows=[
    [btn(t("credit"),"admin-credit","deal_money","💰")],
    [btn(t("mybal"),"admin-bal","deal_person","👤")],
    [btn(t("transfer"),"admin-xfer","btn_deal_stars","⭐")]
  ];
  if(u.is_super_admin){
    rows.push([btn(t("grant"),"admin-grant","btn_create","➕")]);
    rows.push([btn(t("ban"),"admin-ban","btn_cancel","🚫"), btn(t("unban"),"admin-unban","btn_deal_recv","✅")]);
  }
  rows.push([backBtn()]);
  return bubble(`${pe("construction","🛠")} <b>${u.is_super_admin?t("owner"):t("worker")}</b>`)+kb(rows);
}
function currencyScreen(prefix){
  const keys=Object.keys(state.user.balances||{ton:0,rub:0,stars:0,usdt:0,usd:0,eur:0,byn:0,kzt:0,uah:0});
  const meta={ton:["btn_pay_ton","💎"],rub:["btn_pay_rub","💵"],byn:["btn_pay_byn","🇧🇾"],kzt:["btn_pay_kzt","🇰🇿"],uah:["btn_pay_uah","🇺🇦"],stars:["btn_pay_stars","⭐"],usdt:["btn_pay_usdt","🪙"],usd:["btn_pay_usd","💸"],eur:["btn_pay_eur","💰"]};
  const rows=[];
  for(let i=0;i<keys.length;i+=2){
    const a=keys[i], b=keys[i+1];
    const row=[btn(a.toUpperCase(),prefix+"-"+a,(meta[a]||[])[0],(meta[a]||[])[1])];
    if(b) row.push(btn(b.toUpperCase(),prefix+"-"+b,(meta[b]||[])[0],(meta[b]||[])[1]));
    rows.push(row);
  }
  rows.push([backBtn()]);
  return bubble(`${pe("deal_money","💰")} <b>${t("pick_cur")}</b>`)+kb(rows);
}
function screenAdminAmt(kind){
  return bubble(`${pe("deal_money","💰")} <b>${kind==="credit"?t("credit"):t("transfer")}</b><p class="hint">${t("amount")}</p><input id="a-amt" inputmode="decimal" placeholder="50" />`)+
    kb([[act(t("save"),kind==="credit"?"do-credit":"do-xfer","deal_check","✅")],[backBtn()]]);
}
function screenAdminId(kind){
  return bubble(`${pe("deal_person","👤")} <b>${t("uid")}</b><input id="a-uid" inputmode="numeric" placeholder="123456789" />`)+
    kb([[act(t("save"),"id-"+kind,"deal_check","✅")],[backBtn()]]);
}
async function draw(){
  const root=document.getElementById("screen");
  if(!state.user){
    root.innerHTML=bubble("Загрузка…");
    syncTabs();
    return;
  }
  try{
    const s=state.screen;
    if(s==="home") root.innerHTML=await screenHome();
    else if(s==="req") root.innerHTML=screenReq();
    else if(s==="req-ton") root.innerHTML=fieldScreen("TON","balance_ton","💎",t("ask_ton"),"f-ton",state.user.ton_wallet,"save-ton");
    else if(s==="req-card") root.innerHTML=fieldScreen(t("card"),"balance_card","💳",t("ask_card"),"f-card",state.user.card_number,"save-card");
    else if(s==="req-user") root.innerHTML=fieldScreen(t("uname"),"deal_person","👤",t("ask_user"),"f-username",state.user.payout_username,"save-username");
    else if(s==="create-role") root.innerHTML=screenCreateRole();
    else if(s.startsWith("create-type")) root.innerHTML=screenCreateType();
    else if(s.startsWith("create-pay")) root.innerHTML=screenCreatePay();
    else if(s==="create-amt") root.innerHTML=screenCreateAmt();
    else if(s==="create-desc") root.innerHTML=screenCreateDesc();
    else if(s==="create-done") root.innerHTML=screenCreateDone();
    else if(s==="bal") root.innerHTML=screenBal();
    else if(s==="wd") root.innerHTML=screenWd();
    else if(s==="deals") root.innerHTML=await screenDeals();
    else if(s==="refs") root.innerHTML=screenRefs();
    else if(s==="lang") root.innerHTML=screenLang();
    else if(s==="admin") root.innerHTML=screenAdmin();
    else if(s==="admin-credit") root.innerHTML=currencyScreen("acred");
    else if(s==="admin-xfer") root.innerHTML=currencyScreen("axfer");
    else if(s==="admin-bal") {
      const b=state.user.balances||{};
      const groups=GROUPS.map(([name,keys])=>`<b>${name}</b>`+keys.map(([k,fb,icon])=>`<div class="line">${pe(icon,fb)} ${k.toUpperCase()}: <b>${b[k]??0}</b></div>`).join("")).join("<br>");
      root.innerHTML=bubble(`${pe("deal_person","👤")} <b>${t("mybal")}</b><br><br>${groups}`)+kb([[backBtn()]]);
    }
    else if(s==="admin-amt") root.innerHTML=screenAdminAmt(state.admin.kind);
    else if(s==="admin-id") root.innerHTML=screenAdminId(state.admin.kind);
    else if(s==="admin-grant"||s==="admin-ban"||s==="admin-unban") root.innerHTML=screenAdminId(s.replace("admin-",""));
    else root.innerHTML=await screenHome();
  }catch(e){root.innerHTML=bubble(`<span class="err">${esc(e.message)}</span>`)+kb([[backBtn()]]);}
  root.className="";
  void root.offsetWidth;
  root.className="panel"+(state.dir==="back"?" back":"");
  syncTabs();
}
let bootDealDone=false;
async function loadMe(opts={}){
  const boot=bootParams();
  const setlang=boot.setlang;
  if(!boot.picklang && /^[a-z]{2,3}(?:-[a-z0-9]{2,8})?$/.test(setlang)){
    try{await api("/api/language",{method:"POST",body:JSON.stringify({language:setlang})});rememberLang(setlang);}catch(e){}
  }
  const data=await api("/api/me");
  state.user=data.user;
  syncLangChip();
  if(opts.skipDeal || bootDealDone) return;
  bootDealDone=true;
  let deal=boot.deal||"";
  const sp=data.user.start_param||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"";
  if(!deal && String(sp).startsWith("deal_")) deal=sp.slice(5);
  if(deal){
    try{
      const r=await api("/api/deals/"+deal+"/join",{method:"POST"});
      if(r.joined) toast("Вы вошли в сделку");
    }catch(e){toast(e.message);}
    state.screen="deals";
    state.stack=["home","deals"];
  }
}
document.body.addEventListener("click",async(ev)=>{
  const goBtn=ev.target.closest("[data-go]");
  if(goBtn){
    ev.preventDefault();
    const name=goBtn.dataset.go;
    if(name==="create-type-seller"||name==="create-type-buyer"){state.draft.role=name.endsWith("seller")?"seller":"buyer";go("create-type");return;}
    if(name.startsWith("create-pay-")){state.draft.deal_type=name.slice(11);go("create-pay");return;}
    if(name.startsWith("create-amt-")){state.draft.pay_method=name.slice(11);go("create-amt");return;}
    if(name.startsWith("wd-")){state.wmethod=name.slice(3);go("wd");return;}
    if(name.startsWith("set-lang-")){
      await pickLanguage(name.endsWith("en")?"en":"ru");
      return;
    }
    if(name.startsWith("acred-")){state.admin={kind:"credit",currency:name.slice(6)};go("admin-amt");return;}
    if(name.startsWith("axfer-")){state.admin={kind:"xfer",currency:name.slice(6)};go("admin-id");return;}
    go(name);return;
  }
  const a=ev.target.closest("[data-act]");
  if(!a) return;
  const actName=a.dataset.act;
  try{
    if(actName==="pick-lang"){await pickLanguage(a.dataset.lang);return;}
    if(actName==="support"){const url=state.user.support_url;if(tg&&tg.openTelegramLink) tg.openTelegramLink(url);else window.open(url,"_blank");return;}
    if(actName==="go:home"){
      if(!state.user){try{await loadMe();}catch(e){toast(e.message);return;}}
      go("home");return;
    }
    if(actName.startsWith("save-")){
      const field=actName.slice(5);
      const id=field==="username"?"f-username":"f-"+field;
      const value=document.getElementById(id).value;
      const data=await api("/api/requisites",{method:"POST",body:JSON.stringify({field,value})});
      state.user={...state.user,...data.user,is_admin:state.user.is_admin,is_super_admin:state.user.is_super_admin};
      toast("Сохранено");go("req","back");return;
    }
    if(actName==="deal-amount"){
      const n=parseAmount((document.getElementById("f-amount")||{}).value);
      if(n==null){toast("Введите сумму числом, например 100");return;}
      state.draft.amount=n;go("create-desc");return;
    }
    if(actName==="deal-make"){
      state.draft.description=(document.getElementById("f-desc")||{}).value||"";
      const n=parseAmount(state.draft.amount);
      if(n==null){toast("Введите сумму сделки");go("create-amt");return;}
      const data=await api("/api/deals",{method:"POST",body:JSON.stringify({...state.draft,amount:n})});
      state.link=data.link;go("create-done");return;
    }
    if(actName==="copy-link"||actName.startsWith("copy:")){
      const text=actName==="copy-link"?state.link:actName.slice(5);
      navigator.clipboard.writeText(text);toast("Скопировано");return;
    }
    if(actName==="do-withdraw"){
      await api("/api/withdraw",{method:"POST",body:JSON.stringify({method:state.wmethod,amount:document.getElementById("w-amount").value})});
      toast("Заявка принята");await loadMe();go("bal","back");return;
    }
    if(actName.startsWith("deal-cancel-")){await api("/api/deals/"+actName.slice(12)+"/cancel",{method:"POST"});toast("Отменено");draw();return;}
    if(actName.startsWith("deal-paybal-")){await api("/api/deals/"+actName.slice(12)+"/paybal",{method:"POST"});toast("Оплачено");draw();return;}
    if(actName.startsWith("deal-sent-")){await api("/api/deals/"+actName.slice(10)+"/sent",{method:"POST"});toast("Готово");draw();return;}
    if(actName.startsWith("deal-recv-")){await api("/api/deals/"+actName.slice(10)+"/recv",{method:"POST"});toast("Готово");draw();return;}
    if(actName==="do-credit"){
      await api("/api/admin/credit",{method:"POST",body:JSON.stringify({currency:state.admin.currency,amount:document.getElementById("a-amt").value})});
      toast("Готово");await loadMe();go("admin","back");return;
    }
    if(actName==="id-xfer"){state.admin.uid=document.getElementById("a-uid").value;go("admin-amt");return;}
    if(actName==="do-xfer"){
      await api("/api/admin/transfer",{method:"POST",body:JSON.stringify({currency:state.admin.currency,user_id:state.admin.uid,amount:document.getElementById("a-amt").value})});
      toast("Готово");go("admin","back");return;
    }
    if(actName==="id-grant"){await api("/api/admin/grant",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value})});toast("Воркер добавлен");go("admin","back");return;}
    if(actName==="id-ban"){await api("/api/admin/ban",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value,action:"ban"})});toast("Готово");go("admin","back");return;}
    if(actName==="id-unban"){await api("/api/admin/ban",{method:"POST",body:JSON.stringify({user_id:document.getElementById("a-uid").value,action:"unban"})});toast("Готово");go("admin","back");return;}
  }catch(e){toast(e.message);}
});
document.body.addEventListener("input",(ev)=>{
  if(ev.target&&ev.target.id==="lang-q") filterLangs();
});
if(tg&&tg.BackButton){tg.BackButton.onClick(()=>back());}
(async function init(){
  let lastErr=null;
  for(let i=0;i<8;i++){
    try{
      await loadMe();
      if(needLangPicker()){
        state.screen="lang";
        state.stack=["lang"];
      }
      syncLangChip();
      syncBack();
      await draw();
      return;
    }catch(e){
      lastErr=e;
      await new Promise(r=>setTimeout(r,250));
    }
  }
  document.getElementById("screen").innerHTML=bubble(`<b>Не удалось открыть сессию</b><p class="hint">Закрой окно и нажми «Выбрать язык» в боте.</p>`)+kb([[act("Повторить","go:home","btn_back","🔄")]]);
})();
  </script>
</body>
